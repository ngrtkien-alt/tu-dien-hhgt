<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Từ điển thuật ngữ Anh–Việt · Hình học giải tích</title>
<meta name="description" content="Từ điển thuật ngữ Anh–Việt cho học phần Hình học giải tích: 284 mục từ về đại số vectơ, phương pháp tọa độ trong mặt phẳng và trong không gian. Tra cứu EN/VI không dấu, bảng tra A–Z, mô hình mặt bậc hai 3D, flashcard.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#EBE2CC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1E1B16" media="(prefers-color-scheme: dark)">
<meta property="og:type" content="website">
<meta property="og:title" content="Từ điển thuật ngữ Anh–Việt · Hình học giải tích">
<meta property="og:description" content="284 mục từ Anh–Việt về vectơ, tọa độ trên mặt phẳng và trong không gian, có ví dụ, nguồn và bảng tra A–Z.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;1,400&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap">
<style>
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: an old mathematics dictionary — title page masthead, a sticky index bar, a catalogue sidebar and entries that open like index cards. */
:root{
  --paper:#EBE2CC;      /* page */
  --paper-2:#DED6C1;    /* bands, open cards */
  --rule:#CFC6B1;       /* hairlines */
  --muted:#B7B09E;      /* offset shadows, decorative strokes */
  --ink:#2B2720;        /* text */
  --ink-2:#5C5547;      /* secondary text */
  --accent:#2F4D5B;     /* slate ink: links, numbers */
  --card:#F2EDDF;       /* flashcard face */
  --f-display:"Newsreader",Georgia,"Times New Roman",serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --bar-h:120px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1E1B16;--paper-2:#28241D;--rule:#3B362C;--muted:#5E584A;--ink:#EBE2CC;--ink-2:#B7B09E;--accent:#9FBBC8;--card:#2D2921;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#1E1B16;--paper-2:#28241D;--rule:#3B362C;--muted:#5E584A;--ink:#EBE2CC;--ink-2:#B7B09E;--accent:#9FBBC8;--card:#2D2921;color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.65;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.inner{max-width:1240px;margin:0 auto}

/* ---------- masthead ---------- */
.mast{border-bottom:3px double var(--ink);padding-block:28px 22px}
.mast .inner{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end;position:relative}
.kicker,.lbl,.mono{font-family:var(--f-mono)}
.kicker{font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);margin:0 0 10px}
.mast h1{font-family:var(--f-display);font-weight:400;font-size:clamp(2rem,5.4vw,3.6rem);line-height:1.04;margin:0;text-wrap:balance;letter-spacing:-.01em}
.mast h1 em{font-style:italic}
.mast-sub{margin:12px 0 0;color:var(--ink-2);font-size:.98rem;max-width:62ch}
.stats{display:flex;flex-wrap:wrap;gap:6px 22px;margin:16px 0 0;padding:0;font-family:var(--f-mono);font-size:.78rem;color:var(--ink-2)}
.stats div{display:flex;gap:6px;align-items:baseline}
.stats dt{order:2;margin:0}
.stats dd{order:1;margin:0;color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
.mast-fig{margin:0;text-align:center}
.mast-fig canvas{width:180px;height:180px;display:block}
.mast-fig figcaption{font-family:var(--f-mono);font-size:.68rem;color:var(--ink-2);letter-spacing:.04em}
.mast-meta{margin:10px 0 0;font-family:var(--f-mono);font-size:.76rem;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:2px 16px}
.ph{outline:1px dashed var(--accent);outline-offset:1px;color:var(--accent)}

/* ---------- sticky bar ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--rule)}
.bar .inner{display:flex;flex-direction:column;gap:10px;padding-block:12px 0}
.bar-row{display:flex;gap:10px;align-items:center}
.search{flex:1;min-width:0;position:relative}
.search input{width:100%;background:var(--paper-2);border:1px solid var(--ink);border-radius:0;padding:.62rem 2.4rem .62rem 2.4rem;font-family:var(--f-body);font-size:1rem;box-shadow:2px 2px 0 var(--muted)}
.search input::placeholder{color:var(--ink-2);opacity:.85}
.search svg{position:absolute;left:.75rem;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--ink-2)}
.search .clear{position:absolute;right:.4rem;top:50%;transform:translateY(-50%);background:none;border:0;cursor:pointer;font-family:var(--f-mono);color:var(--ink-2);padding:.3rem .5rem}
.search kbd{position:absolute;right:.7rem;top:50%;transform:translateY(-50%);font-family:var(--f-mono);font-size:.7rem;color:var(--ink-2);border:1px solid var(--rule);padding:0 .35rem}
.seg{display:inline-flex;border:1px solid var(--ink);box-shadow:2px 2px 0 var(--muted);flex:none}
.seg button{background:var(--paper);border:0;padding:.5rem .7rem;font-family:var(--f-mono);font-size:.78rem;cursor:pointer;letter-spacing:.06em}
.seg button+button{border-left:1px solid var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.iconbtn{flex:none;background:var(--paper);border:1px solid var(--ink);box-shadow:2px 2px 0 var(--muted);width:2.5rem;height:2.4rem;display:grid;place-items:center;cursor:pointer}
.iconbtn svg{width:18px;height:18px;stroke:var(--ink);fill:none}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:0 -4px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;background:none;border:0;border-bottom:2px solid transparent;padding:.45rem .75rem .55rem;cursor:pointer;font-family:var(--f-mono);font-size:.8rem;letter-spacing:.04em;color:var(--ink-2);white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.tab .count{font-size:.7rem;margin-left:4px;color:var(--accent)}

/* ---------- layout ---------- */
main{padding-block:26px 64px}
.layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:40px;align-items:start}
.toc{position:sticky;top:calc(var(--bar-h) + env(safe-area-inset-top,0px) + 18px);max-height:calc(100vh - var(--bar-h) - 40px);max-height:calc(100dvh - var(--bar-h) - 40px);overflow:auto;font-size:.9rem;padding-right:6px}
.toc h2{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);font-weight:500;margin:0 0 8px}
.toc ul{list-style:none;margin:0;padding:0}
.toc button{width:100%;text-align:left;background:none;border:0;cursor:pointer;padding:.28rem .4rem;display:grid;grid-template-columns:2.4rem 1fr auto;gap:4px;align-items:baseline;line-height:1.35;color:var(--ink-2)}
.toc button:hover{color:var(--ink);background:var(--paper-2)}
.toc button[aria-current="true"]{color:var(--ink);background:var(--paper-2);box-shadow:inset 2px 0 0 var(--ink)}
.toc .sec-n,.toc .cnt{font-family:var(--f-mono);font-size:.72rem;font-variant-numeric:tabular-nums}
.toc .cnt{color:var(--accent)}
.toc .ch{font-family:var(--f-display);font-size:1rem;color:var(--ink);margin-top:12px}
.toc .ch .sec-n{font-size:.75rem}
.mobile-filter{display:none}
.mobile-filter select{width:100%;background:var(--paper-2);border:1px solid var(--ink);border-radius:0;padding:.55rem .6rem;font-family:var(--f-body)}

.toolbar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin:0 0 14px}
.toolbar p{margin:0;font-family:var(--f-mono);font-size:.78rem;color:var(--ink-2)}
.btn{background:var(--paper);border:1px solid var(--ink);box-shadow:2px 2px 0 var(--muted);padding:.38rem .75rem;font-family:var(--f-mono);font-size:.76rem;letter-spacing:.03em;cursor:pointer;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.btn:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--muted)}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.btn svg{width:14px;height:14px;stroke:currentColor;fill:none}

.chap-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;border-bottom:1px solid var(--ink);padding-bottom:8px;margin:34px 0 4px}
.chap-h:first-child{margin-top:0}
.chap-h .no{font-family:var(--f-mono);font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.chap-h h2{font-family:var(--f-display);font-weight:400;font-size:1.75rem;line-height:1.15;margin:0;text-wrap:balance}
.chap-h .alt{font-style:italic;color:var(--ink-2);font-size:.95rem}
.sec-h{margin:26px 0 2px;display:grid;grid-template-columns:3.2rem 1fr;gap:2px 10px}
.sec-h .no{font-family:var(--f-mono);font-size:.82rem;color:var(--accent);padding-top:.25rem}
.sec-h h3{font-family:var(--f-display);font-size:1.3rem;font-weight:600;margin:0;line-height:1.3;text-wrap:balance}
.sec-h p{grid-column:2;margin:0;color:var(--ink-2);font-style:italic;font-size:.92rem}
.sec-h .note{font-style:normal;font-family:var(--f-mono);font-size:.7rem}

/* ---------- entries ---------- */
.entries{border-top:1px solid var(--rule)}
.entry{border-bottom:1px solid var(--rule)}
.entry.open{background:var(--paper-2)}
.entry-row{display:grid;grid-template-columns:3.6rem minmax(0,1fr) auto;gap:10px;align-items:start;padding-inline:8px}
.num{font-family:var(--f-mono);font-size:.76rem;color:var(--accent);padding-top:.95rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.toggle{background:none;border:0;text-align:left;cursor:pointer;padding:.7rem 0;min-width:0;display:block;width:100%}
.terms{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px}
.en{font-family:var(--f-display);font-size:1.28rem;font-weight:500;line-height:1.3}
.var{color:var(--ink-2);font-size:.92em;font-style:italic}
.arrow{font-family:var(--f-mono);color:var(--ink-2);font-size:.85rem}
.vi{font-weight:500;font-size:1rem;line-height:1.35}
.pos{font-family:var(--f-mono);font-size:.66rem;border:1px solid var(--rule);padding:0 5px;color:var(--ink-2);align-self:center}
.lang-en .vi{font-weight:400;font-style:italic}
.preview{display:block;color:var(--ink-2);font-size:.9rem;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entry.open .preview{display:none}
.match-def{font-family:var(--f-mono);font-size:.66rem;color:var(--accent);margin-left:2px}
mark{background:transparent;color:inherit;box-shadow:inset 0 -.42em 0 var(--muted)}
.star{background:none;border:0;cursor:pointer;padding:.8rem .2rem .5rem;color:var(--ink-2)}
.star svg{width:18px;height:18px;stroke:currentColor;fill:none}
.star[aria-pressed="true"]{color:var(--accent)}
.star[aria-pressed="true"] svg{fill:currentColor}
.entry-body{padding:4px 8px 22px calc(3.6rem + 18px)}
.defs{display:grid;grid-template-columns:1fr 1fr;gap:6px 30px}
.blk{margin-top:14px}
.lbl{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);margin:0 0 6px;font-weight:500}
.para{margin:0;max-width:62ch;min-width:0;overflow-wrap:anywhere}
.para .tag{font-family:var(--f-mono);font-size:.64rem;border:1px solid var(--ink-2);color:var(--ink-2);padding:0 4px;margin-right:6px;vertical-align:2px}
.ex .para{font-size:.96rem}
.meta{display:grid;grid-template-columns:7.5rem minmax(0,1fr);gap:8px 14px;margin-top:18px;padding-top:14px;border-top:1px dashed var(--muted);font-size:.92rem}
.meta dt{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);padding-top:.2rem}
.meta dd{margin:0;display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.chip{background:var(--paper);border:1px solid var(--rule);padding:.12rem .5rem;cursor:pointer;font-size:.86rem;text-align:left}
.chip:hover{border-color:var(--ink)}
.chip b{font-family:var(--f-mono);font-weight:500;font-size:.72rem;color:var(--accent);margin-right:4px}
.chip.off{cursor:default;color:var(--ink-2);opacity:.75;border-style:dashed}
.src{font-style:italic;color:var(--ink-2);overflow-wrap:anywhere}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}

.empty{border:1px dashed var(--muted);padding:28px;text-align:center;color:var(--ink-2)}
.empty strong{display:block;font-family:var(--f-display);font-size:1.3rem;color:var(--ink);font-weight:400;margin-bottom:6px}

/* ---------- index (A–Z) ---------- */
.letters{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 16px}
.letters button{font-family:var(--f-mono);font-size:.8rem;min-width:2rem;padding:.25rem .4rem;background:var(--paper);border:1px solid var(--rule);cursor:pointer}
.letters button:hover{border-color:var(--ink)}
.tablewrap{overflow-x:auto}
table.lookup{width:100%;border-collapse:collapse;font-size:.95rem}
.lookup th{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);font-weight:500;text-align:left;border-bottom:1px solid var(--ink);padding:.45rem .5rem}
.lookup td{border-bottom:1px solid var(--rule);padding:.42rem .5rem;vertical-align:top}
.lookup td:first-child{font-family:var(--f-display);font-size:1.04rem}
.lookup td:nth-child(2){color:var(--ink-2)}
.lookup td:last-child{white-space:nowrap;text-align:right}
.lookup tr.grp td{font-family:var(--f-display);font-size:1.5rem;color:var(--accent);border-bottom:1px solid var(--ink);padding-top:1.1rem}
.nlink{background:none;border:0;cursor:pointer;font-family:var(--f-mono);font-size:.78rem;color:var(--accent);padding:.1rem .25rem;text-decoration:underline;text-underline-offset:3px}

/* ---------- 3D ---------- */
.q-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:28px;align-items:start}
.q-stage{border:1px solid var(--ink);background:var(--paper-2);box-shadow:5px 5px 0 var(--rule);position:relative}
.q-stage canvas{display:block;width:100%;aspect-ratio:4/3;max-width:100%;touch-action:none;cursor:grab}
.q-stage canvas:active{cursor:grabbing}
.q-hint{position:absolute;left:10px;bottom:8px;font-family:var(--f-mono);font-size:.68rem;color:var(--ink-2)}
.q-pick{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.q-pick button{background:var(--paper);border:1px solid var(--rule);padding:.3rem .6rem;font-size:.86rem;cursor:pointer}
.q-pick button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.q-title{font-family:var(--f-display);font-size:1.6rem;line-height:1.15;margin:0;font-weight:400}
.q-sub{color:var(--ink-2);font-style:italic;margin:2px 0 0}
.eq{font-family:var(--f-display);font-size:1.35rem;margin:16px 0 4px;padding:10px 12px;border:1px solid var(--rule);background:var(--paper);overflow-x:auto;white-space:nowrap}
.eq-num{font-family:var(--f-mono);font-size:.74rem;color:var(--ink-2)}
.ctrl{display:grid;grid-template-columns:2.2rem 1fr 3rem;gap:10px;align-items:center;margin:10px 0}
.ctrl label{font-family:var(--f-display);font-style:italic;font-size:1.15rem}
.ctrl output{font-family:var(--f-mono);font-size:.8rem;text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent)}
.check{display:flex;gap:8px;align-items:center;margin:8px 0;font-size:.95rem;cursor:pointer}
.check input{accent-color:var(--accent);width:16px;height:16px}
.section-note{font-size:.92rem;color:var(--ink-2);margin:4px 0 0;min-height:1.5em}
.section-note b{color:var(--ink);font-weight:600}
.rev{display:inline-block;margin-top:8px;font-family:var(--f-mono);font-size:.72rem;color:var(--accent);border:1px solid var(--accent);padding:1px 7px}
.q-links{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}

/* ---------- flashcards ---------- */
.fc-wrap{max-width:720px;margin:0 auto}
.fc-opts{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin-bottom:22px}
.fc-opts label{font-family:var(--f-mono);font-size:.74rem;color:var(--ink-2);display:flex;gap:8px;align-items:center}
.fc-opts select{background:var(--paper-2);border:1px solid var(--ink);border-radius:0;padding:.35rem .45rem;font-family:var(--f-body);font-size:.92rem}
.fcard{position:relative;background:var(--card);border:1px solid var(--ink);box-shadow:6px 6px 0 var(--rule);min-height:300px;padding:44px 28px 28px;cursor:pointer;
  background-image:linear-gradient(var(--accent),var(--accent)),repeating-linear-gradient(to bottom,transparent 0,transparent 31px,var(--rule) 31px,var(--rule) 32px);
  background-size:100% 2px,100% 100%;background-position:0 36px,0 36px;background-repeat:no-repeat,repeat}
.fcard .corner{position:absolute;top:10px;left:14px;right:14px;display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:.7rem;color:var(--ink-2)}
.fcard .front{font-family:var(--f-display);font-size:clamp(1.6rem,4.6vw,2.4rem);line-height:1.2;text-align:center;margin:40px 0 0;text-wrap:balance}
.fcard .back{text-align:center;margin-top:18px}
.fcard .back .other{font-weight:600;font-size:1.3rem}
.fcard .back p{color:var(--ink-2);max-width:56ch;margin:12px auto 0;font-size:.96rem;text-align:left}
.fcard .hint{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-family:var(--f-mono);font-size:.68rem;color:var(--ink-2)}
.fc-actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:26px}
.fc-progress{text-align:center;font-family:var(--f-mono);font-size:.76rem;color:var(--ink-2);margin-top:14px}
.fade{animation:fade .25s ease}
@keyframes fade{from{opacity:.2}to{opacity:1}}

/* ---------- about ---------- */
.prose{max-width:760px}
.prose h2{font-family:var(--f-display);font-weight:400;font-size:1.8rem;margin:0 0 10px}
.prose h3{font-family:var(--f-display);font-size:1.2rem;margin:30px 0 8px}
.conv{display:grid;grid-template-columns:8.5rem minmax(0,1fr);border-top:1px solid var(--ink)}
.conv dt,.conv dd{border-bottom:1px solid var(--rule);padding:.7rem 0;margin:0}
.conv dt{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);padding-right:12px}
.conv dd{font-size:.97rem}
.tips{padding-left:1.1rem}
.tips li{margin:.3rem 0}
.team{list-style:none;margin:8px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px 22px;counter-reset:m}
.team li{counter-increment:m;border-bottom:1px solid var(--rule);padding:.35rem 0}
.team li::before{content:counter(m,decimal-leading-zero);font-family:var(--f-mono);font-size:.72rem;color:var(--accent);margin-right:10px}
.facts{display:grid;grid-template-columns:8.5rem minmax(0,1fr);border-top:1px solid var(--ink);margin:0}
.facts dt,.facts dd{border-bottom:1px solid var(--rule);padding:.55rem 0;margin:0}
.facts dt{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);padding-right:12px}
kbd.k{font-family:var(--f-mono);font-size:.78rem;border:1px solid var(--ink-2);padding:0 .3rem}

footer{border-top:3px double var(--ink);padding-block:18px 28px;font-family:var(--f-mono);font-size:.72rem;color:var(--ink-2)}

/* ================= storage ================= */
const store = {
  get(k,d){try{const v=localStorage.getItem("hhgt:"+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem("hhgt:"+k,JSON.stringify(v))}catch(e){}}
};

/* ================= state ================= */

};

const fmtDate=iso=>{const m=/^(\d{4})-(\d\d)-(\d\d)/.exec(iso||"");return m?`${m[3]}/${m[2]}/${m[1]}`:""};
const $=(s,r=document)=>r.querySelector(s);
const view=$("#view");
const t=()=>T[S.lang];

/* ================= helpers ================= */
const PRINT_ICON='<svg viewBox="0 0 24 24" stroke-width="1.8"><path d="M7 9V3h10v6M7 17H4v-7h16v7h-3"/><rect x="7" y="14" width="10" height="7"/></svg>';
const PRINT_BTN=()=>`<button class="btn" data-print="all">${PRINT_ICON}${t().print}</button>`;
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function normChar(c){
  if(c==="đ")return"d"; if(c==="Đ")return"d";
  const n=c.normalize("NFD").replace(/[̀-ͯ]/g,"");
  return (n||c).toLowerCase().charAt(0)||c;
}
function norm(s){let o="";for(const c of s)o+=normChar(c);return o}
function splitTerm(s){const m=s.match(/^(.*?)\s*(\(.*\))\s*$/);return m?[m[1],m[2]]:[s,""]}
function hl(text,qn){
  if(!qn)return esc(text);
  const chars=[...text];const n=chars.map(normChar).join("");
  const i=n.indexOf(qn);if(i<0)return esc(text);
  return esc(chars.slice(0,i).join(""))+"<mark>"+esc(chars.slice(i,i+qn.length).join(""))+"</mark>"+esc(chars.slice(i+qn.length).join(""));
}
function termHTML(s,qn){const [a,b]=splitTerm(s);return hl(a,qn)+(b?` <span class="var">${hl(b,qn)}</span>`:"")}
let toastTimer;
function toast(msg){const el=$("#toast");el.textContent=msg;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.hidden=true,1600)}
function copyText(txt){
  const done=()=>toast(t().copied);
  try{navigator.clipboard.writeText(txt).then(done,()=>fallback())}catch(e){fallback()}
  function fallback(){const ta=document.createElement("textarea");ta.value=txt;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();try{document.execCommand("copy");done()}catch(e){}ta.remove()}
}
const canSpeak=typeof window.speechSynthesis!=="undefined"&&typeof window.SpeechSynthesisUtterance!=="undefined";
function speak(txt){
  if(!canSpeak)return;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(txt);u.lang="en-US";u.rate=.92;
    const v=speechSynthesis.getVoices().find(v=>/^en(-|_)/i.test(v.lang));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}
}
function cleanEn(s){return splitTerm(s)[0].replace(/^17 /,"seventeen ")}

}

$("#langEn").addEventListener("click",()=>setLang("en"));

function renderChrome(){
  const L=t();
  document.querySelectorAll("[data-i]").forEach(el=>{el.innerHTML=L[el.dataset.i]});
  $("#mastTitle").innerHTML=L.title;
  $("#mastSub").textContent=L.sub;
  $("#q").placeholder=L.ph;
  $("#footL").textContent=L.footL;$("#footR").textContent=D?`${L.footR}: ${fmtDate(D.version)}`:"";
  const meta=[CFG.university,CFG.faculty,CFG.class,CFG.semester].filter(Boolean);
  $("#mastMeta").innerHTML=meta.map(x=>`<span${isPh(x)?' class="ph"':""}>${esc(x)}</span>`).join("");
  $("#printHead").textContent=[L.kicker.replace(/^.*· /,""),...meta.filter(x=>!isPh(x)),D?fmtDate(D.version):""].filter(Boolean).join(" · ");
  document.title=S.lang==="en"?"English–Vietnamese Glossary · Analytic Geometry":"Từ điển thuật ngữ Anh–Việt · Hình học giải tích";
  if(D){
    $("#stats").innerHTML=[[D.entries.length,L.sEntries],[D.lookupEnVi.length,L.sEn],[D.lookupViEn.length,L.sVi],[D.chapters.length,L.sChap]]
      .map(([n,l])=>`<div><dt>${l}</dt><dd>${n}</dd></div>`).join("");
  }
  $("#tabs").innerHTML=VIEWS.map(v=>`<button class="tab" role="tab" data-view="${v}" aria-selected="${S.view===v}">${L.tabs[v]}${v==="saved"&&S.favs.size?`<span class="count">${S.favs.size}</span>`:""}</button>`).join("");
}
$("#tabs").addEventListener("click",e=>{const b=e.target.closest("[data-view]");if(b)go(b.dataset.view)});

function setHash(h){try{history.replaceState(null,"",h?"#"+h:location.pathname+location.search)}catch(e){}}
function go(v,opts={}){
  S.view=v;stopQuad();setHash(v==="browse"?"":v);
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",b.dataset.view===v));
  render();
  if(!opts.keepScroll){const top=$("main").offsetTop-$("#bar").offsetHeight;if(window.scrollY>top)window.scrollTo({top})}
}

/* ================= search ================= */
function buildIndex(){
  const variants=new Map();
  const add=(n,s)=>{if(!variants.has(n))variants.set(n,new Set());variants.get(n).add(s)};
  for(const [a,b,ns] of D.lookupEnVi)ns.forEach(n=>{add(n,a);add(n,b)});
  for(const [a,b,ns] of D.lookupViEn)ns.forEach(n=>{add(n,a);add(n,b)});
  searchIdx=D.entries.map(e=>{
    const names=new Set([e.en,e.vi,...splitTerm(e.en),...splitTerm(e.vi),...(variants.get(e.n)||[])]);
    return {e,names:[...names].filter(Boolean).map(s=>norm(s.replace(/[()]/g,""))),defs:norm(e.defEn+" "+e.defVi)};
  });
}
function search(q){
  const qn=norm(q.trim()).replace(/\s+/g," ");
  if(!qn)return [];
  const m=qn.match(/^#?(\d{1,3})$/);
  const out=[];
  for(const it of searchIdx){
    let s=0;
    if(m&&it.e.n===+m[1])s=200;
    for(const nm of it.names){
      if(nm===qn)s=Math.max(s,100);
      else if(nm.startsWith(qn))s=Math.max(s,80);
      else if((" "+nm).includes(" "+qn))s=Math.max(s,60);
      else if(nm.includes(qn))s=Math.max(s,40);
    }
    let inDef=false;
    if(!s&&qn.length>2&&it.defs.includes(qn)){s=10;inDef=true}
    if(s)out.push({e:it.e,s,inDef});
  }
  out.sort((a,b)=>b.s-a.s||a.e.n-b.e.n);
  return out;
}

document.addEventListener("keydown",e=>{

  if(e.key==="Escape"&&document.activeElement===qEl&&qEl.value){$("#qClear").click()}

    else if(e.key==="ArrowRight")fcAnswer(true);
    else if(e.key==="ArrowLeft")fcAnswer(false);
  }
});

function entryClick(ev){
  const art=ev.target.closest(".entry");
  const act=ev.target.closest("[data-act]");
  if(!act||!art)return;
  const n=+art.dataset.n, e=byN.get(n);
  switch(act.dataset.act){
    case "toggle":
      if(S.open.has(n))S.open.delete(n);else S.open.add(n);
      art.outerHTML=rowHTML(e,currentQn(),art.querySelector(".match-def")!==null);break;
    case "fav":
      if(S.favs.has(n)){S.favs.delete(n);toast(t().removedT)}else{S.favs.add(n);toast(t().savedT)}
      saveFavs();renderChrome();
      if(S.view==="saved")render();else{act.setAttribute("aria-pressed",S.favs.has(n));}
      break;
    case "speak":speak(cleanEn(e.en));break;
    case "copy":copyText(`${e.en} — ${e.vi}`);break;
    case "print":printEntry(art);break;
    case "model":{const [id,pre]=MODEL[n];Object.assign(S.quad,{id,a:1.4,b:1,c:1,rulings:false},QDEF[id].defaults,pre||{});S.quad.h=QDEF[id].h0??.35;go("quadrics");break}
  }
}

function openEntry(n){

function renderBrowse(){
  const L=t(), qn=currentQn();
  let main="";
  if(qn){
    const res=search(S.q);
    main=`<div class="toolbar"><p>${esc(L.results(res.length,S.q.trim()))}</p>${PRINT_BTN()}</div>`;
    if(!res.length)main+=`<div class="empty"><strong>${L.noRes}</strong>${L.noResHint}</div>`;
    else{
      if(res.length<=2)res.forEach(r=>S.open.add(r.e.n));
      main+=`<div class="entries">${res.map(r=>rowHTML(r.e,qn,r.inDef)).join("")}</div>`;
    }
  }else{
    const list=D.entries.filter(e=>(!S.chapter||e.chapter===S.chapter)&&(!S.section||e.section===S.section));
    const allOpen=list.length&&list.every(e=>S.open.has(e.n));
    main=`<div class="toolbar"><p>${L.showing(list.length)}</p><span class="toolbar-btns" style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="expandAll">${allOpen?L.collapseAll:L.expandAll}</button>${PRINT_BTN()}</span></div>`;
    for(const c of D.chapters){
      if(S.chapter&&c.id!==S.chapter)continue;
      const secs=c.sections.filter(s=>!S.section||s.id===S.section);
      main+=`<div class="chap-h"><span class="no">${L.chapter} ${c.id}</span><h2>${esc(S.lang==="en"?c.titleEn:c.titleVi)}</h2><span class="alt">${esc(S.lang==="en"?c.titleVi:c.titleEn)}</span></div>`;
      for(const s of secs){
        const es=list.filter(e=>e.section===s.id);
        main+=`<div class="sec-h"><span class="no">${s.id}</span><h3>${esc(S.lang==="en"?s.titleEn:s.titleVi)}</h3><p>${esc(S.lang==="en"?s.titleVi:s.titleEn)}${s.note?` <span class="note">· ${esc(s.note)}</span>`:""}</p></div>`;
        main+=`<div class="entries">${es.map(e=>rowHTML(e,"",false)).join("")}</div>`;
      }
    }
  }
  view.innerHTML=`<div class="layout"><aside class="toc">${tocHTML()}</aside><div>${qn?"":mobileFilterHTML()}<div id="list">${main}</div></div></div>`;
  bindFilters();
  const ea=$("#expandAll");

    list.forEach(e=>allOpen?S.open.delete(e.n):S.open.add(e.n));render();
  });
}

function letterOf(s,dir){
  const c=[...s][0]||"";
  if(/\d/.test(c))return"0–9";
  if(dir==="vien"){if(c==="đ"||c==="Đ")return"Đ";return normChar(c).toUpperCase()}
  return c.toUpperCase();
}

/* ================= flashcards ================= */
function fcPool(){
  const sc=S.fc.scope;
  if(sc==="saved")return[...S.favs].map(n=>byN.get(n)).filter(Boolean);
  if(sc==="all")return D.entries.slice();
  return D.entries.filter(e=>e.chapter===+sc);
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function fcBuild(){S.fc.deck=shuffle(fcPool().filter(e=>!S.fc.known.has(e.n)).map(e=>e.n));S.fc.flipped=false}
function fcFlip(){S.fc.flipped=!S.fc.flipped;renderCards(true)}
function fcAnswer(ok){
  const d=S.fc.deck;if(!d.length)return;
  const n=d.shift();
  if(ok){S.fc.known.add(n);store.set("known",[...S.fc.known])}else d.push(n);
  S.fc.flipped=false;renderCards(true);
}
function renderCards(keep){
  const L=t();
  if(!keep||!S.fc.deck)fcBuild();
  const pool=fcPool(), d=S.fc.deck, knownHere=pool.filter(e=>S.fc.known.has(e.n)).length;
  const opts=`<div class="fc-opts">
    <label>${L.fcScope}<select id="fcScope">
      <option value="all" ${S.fc.scope==="all"?"selected":""}>${L.fcAll}</option>
      ${D.chapters.map(c=>`<option value="${c.id}" ${S.fc.scope==String(c.id)?"selected":""}>${L.chapter} ${c.id}</option>`).join("")}
      <option value="saved" ${S.fc.scope==="saved"?"selected":""}>${L.fcSaved} (${S.favs.size})</option></select></label>
    <label>${L.fcDir}<select id="fcDir"><option value="en" ${S.fc.dir==="en"?"selected":""}>EN → VI</option><option value="vi" ${S.fc.dir==="vi"?"selected":""}>VI → EN</option></select></label>
    <button class="btn" id="fcShuffle">${L.shuffle}</button><button class="btn" id="fcReset">${L.reset}</button></div>`;
  let card;
  if(!pool.length)card=`<div class="empty"><strong>${L.fcEmpty}</strong>${S.fc.scope==="saved"?L.savedHint:""}</div>`;
  else if(!d.length)card=`<div class="empty"><strong>${L.fcDone}</strong>${L.fcDoneHint}</div>`;
  else{
    const e=byN.get(d[0]), front=S.fc.dir==="en"?e.en:e.vi, back=S.fc.dir==="en"?e.vi:e.en;
    const def=S.lang==="en"?e.defEn:e.defVi;
    card=`<div class="fcard fade" id="fcard" role="button" tabindex="0" aria-label="${L.flip}">
      <div class="corner"><span>№ ${e.n} · ${L.chShort} ${e.chapter} · ${e.section}</span><span>${S.fc.dir==="en"?"EN":"VI"}</span></div>
      <p class="front">${termHTML(front,"")}</p>
      ${S.fc.flipped?`<div class="back"><div class="other">${termHTML(back,"")}</div><p>${esc(def)}</p></div>`:""}
      <div class="hint">${L.fcTap}</div></div>
      <div class="fc-actions">
        ${S.fc.flipped?`<button class="btn" id="fcAgain">← ${L.again}</button><button class="btn" id="fcKnown">${L.known} →</button>`:`<button class="btn" id="fcFlipBtn">${L.flip}</button>`}
        ${canSpeak?`<button class="btn" id="fcSpeak">${L.speak}</button>`:""}
      </div>`;
  }
  view.innerHTML=`<div class="fc-wrap">${opts}${card}<p class="fc-progress">${pool.length?L.fcLeft(d.length,knownHere):""}</p></div>`;
  $("#fcScope").addEventListener("change",e=>{S.fc.scope=e.target.value;renderCards(false)});
  $("#fcDir").addEventListener("change",e=>{S.fc.dir=e.target.value;S.fc.flipped=false;renderCards(true)});
  $("#fcShuffle").addEventListener("click",()=>{shuffle(S.fc.deck);S.fc.flipped=false;renderCards(true)});
  $("#fcReset").addEventListener("click",()=>{pool.forEach(e=>S.fc.known.delete(e.n));store.set("known",[...S.fc.known]);renderCards(false)});
  const fc=$("#fcard");if(fc){fc.addEventListener("click",fcFlip);fc.addEventListener("keydown",ev=>{if(ev.key==="Enter"){ev.preventDefault();fcFlip()}})}
  const b1=$("#fcFlipBtn");if(b1)b1.addEventListener("click",fcFlip);
  const b2=$("#fcKnown");if(b2)b2.addEventListener("click",()=>fcAnswer(true));
  const b3=$("#fcAgain");if(b3)b3.addEventListener("click",()=>fcAnswer(false));
  const b4=$("#fcSpeak");if(b4)b4.addEventListener("click",()=>speak(cleanEn(byN.get(S.fc.deck[0]).en)));
}

/* ================= 3D quadrics ================= */
const lin=(a,b,n)=>Array.from({length:n},(_,i)=>a+(b-a)*i/(n-1));
const TAU=Math.PI*2, N=72;
function ellipseZ(rx,ry,z){return lin(0,TAU,N).map(t=>[rx*Math.cos(t),ry*Math.sin(t),z])}
function clipSplit(pts,ok){const out=[];let cur=[];for(const p of pts){if(ok(p))cur.push(p);else{if(cur.length>1)out.push(cur);cur=[]}}if(cur.length>1)out.push(cur);return out}
const QDEF={
  ellipsoid:{n:255,eq:"x²/a² + y²/b² + z²/c² = 1",params:["a","b","c"],defaults:{a:1.6,b:1.1,c:0.9},axis:"z",
    gen(a,b,c){const L=[];lin(0,Math.PI,13).slice(1,-1).forEach(p=>L.push(ellipseZ(a*Math.sin(p),b*Math.sin(p),c*Math.cos(p))));
      lin(0,TAU,17).slice(0,-1).forEach(t=>L.push(lin(0,Math.PI,N/2).map(p=>[a*Math.sin(p)*Math.cos(t),b*Math.sin(p)*Math.sin(t),c*Math.cos(p)])));return{L}},
    sec(a,b,c,h){const r=1-h*h/(c*c);if(r<-1e-3)return{k:"none"};if(r<0.004)return{k:"point",P:[[0,0,h]]};const s=Math.sqrt(r);return{k:Math.abs(a-b)<.05?"circle":"ellipse",L:[ellipseZ(a*s,b*s,h)]}},
    rev(a,b,c){return Math.abs(a-b)<.05?(Math.abs(a-c)<.05?257:256):null}},
  sphere:{n:257,eq:"x² + y² + z² = R²",params:["R"],defaults:{a:1.2},axis:"z",
    gen(R){return QDEF.ellipsoid.gen(R,R,R)},sec(R,_b,_c,h){return QDEF.ellipsoid.sec(R,R,R,h)},rev(){return null}},
  hyp1:{n:258,eq:"x²/a² + y²/b² − z²/c² = 1",params:["a","b","c"],defaults:{a:1.3,b:0.9,c:0.9},axis:"z",ruled:true,
    gen(a,b,c){const U=1.2,L=[],R=[];lin(-U,U,9).forEach(u=>L.push(ellipseZ(a*Math.cosh(u),b*Math.cosh(u),c*Math.sinh(u))));
      lin(0,TAU,17).slice(0,-1).forEach(t=>L.push(lin(-U,U,N/2).map(u=>[a*Math.cosh(u)*Math.cos(t),b*Math.cosh(u)*Math.sin(t),c*Math.sinh(u)])));
      const sm=Math.sinh(U);lin(0,TAU,19).slice(0,-1).forEach(t=>{[1,-1].forEach(sg=>R.push([-sm,sm].map(s=>[a*(Math.cos(t)-s*Math.sin(t)),b*(Math.sin(t)+s*Math.cos(t)),sg*c*s])))});return{L,R}},
    sec(a,b,c,h){const s=Math.sqrt(1+h*h/(c*c));return{k:Math.abs(a-b)<.05?"circle":"ellipse",L:[ellipseZ(a*s,b*s,h)]}},
    rev(a,b){return Math.abs(a-b)<.05?260:null}},
  hyp2:{n:259,eq:"x²/a² − y²/b² − z²/c² = 1",params:["a","b","c"],defaults:{a:0.6,b:0.9,c:0.9},axis:"x",
    gen(a,b,c){const U=1.35,L=[];[1,-1].forEach(sg=>{lin(0.15,U,7).forEach(u=>L.push(lin(0,TAU,N).map(t=>[sg*a*Math.cosh(u),b*Math.sinh(u)*Math.cos(t),c*Math.sinh(u)*Math.sin(t)])));
      lin(0,TAU,13).slice(0,-1).forEach(t=>L.push(lin(0,U,N/2).map(u=>[sg*a*Math.cosh(u),b*Math.sinh(u)*Math.cos(t),c*Math.sinh(u)*Math.sin(t)])))});return{L}},
    sec(a,b,c,h){const r=h*h/(a*a)-1;if(r<-1e-3)return{k:"none"};if(r<0.01)return{k:"point",P:[[h,0,0]]};const s=Math.sqrt(r);return{k:Math.abs(b-c)<.05?"circle":"ellipse",L:[lin(0,TAU,N).map(t=>[h,b*s*Math.cos(t),c*s*Math.sin(t)])]}},
    rev(a,b,c){return Math.abs(b-c)<.05?260:null}},
  ellParab:{n:261,eq:"x²/a² + y²/b² = 2pz",params:["a","b","p"],defaults:{a:1.2,b:0.8,c:0.6},axis:"z",
    gen(a,b,p){const R0=1.3,L=[];lin(0,R0,8).slice(1).forEach(r=>L.push(ellipseZ(a*r,b*r,r*r/(2*p))));
      lin(0,TAU,17).slice(0,-1).forEach(t=>L.push(lin(0,R0,N/2).map(r=>[a*r*Math.cos(t),b*r*Math.sin(t),r*r/(2*p)])));return{L}},
    sec(a,b,p,h){if(h<-1e-3)return{k:"none"};if(h<0.02)return{k:"point",P:[[0,0,0]]};const r=Math.sqrt(2*p*h);return{k:Math.abs(a-b)<.05?"circle":"ellipse",L:[ellipseZ(a*r,b*r,h)]}},
    rev(a,b){return Math.abs(a-b)<.05?262:null}},
  hypParab:{n:263,eq:"x²/a² − y²/b² = 2pz",params:["a","b","p"],defaults:{a:1.2,b:1.2,c:0.7},axis:"z",ruled:true,
    gen(a,b,p){const M=1.3,L=[],R=[];const P=(X,Y)=>[a*X,b*Y,(X*X-Y*Y)/(2*p)];
      lin(-M,M,11).forEach(X=>L.push(lin(-M,M,N/2).map(Y=>P(X,Y))));lin(-M,M,11).forEach(Y=>L.push(lin(-M,M,N/2).map(X=>P(X,Y))));
      lin(-2*M,2*M,15).forEach(k=>{const sm=2*M-Math.abs(k);if(sm<.05)return;R.push([-sm,sm].map(s=>P((k+s)/2,(s-k)/2)));R.push([-sm,sm].map(s=>P((k+s)/2,(k-s)/2)))});return{L,R}},
    sec(a,b,p,h){const M=1.3,ok=q=>Math.abs(q[0]/a)<=M+1e-9&&Math.abs(q[1]/b)<=M+1e-9;
      if(Math.abs(h)<0.015)return{k:"lines",L:[[[-a*M,-b*M,h],[a*M,b*M,h]],[[-a*M,b*M,h],[a*M,-b*M,h]]]};
      const r=Math.sqrt(Math.abs(2*p*h)),ts=lin(-3,3,120),L=[];
      [1,-1].forEach(sg=>{const pts=ts.map(t=>h>0?[sg*a*r*Math.cosh(t),b*r*Math.sinh(t),h]:[a*r*Math.sinh(t),sg*b*r*Math.cosh(t),h]);L.push(...clipSplit(pts,ok))});
      return L.length?{k:"hyper",L}:{k:"none"}},
    rev(){return null}},
  cone:{n:253,eq:"x²/a² + y²/b² − z²/c² = 0",params:["a","b","c"],defaults:{a:1.1,b:0.8,c:1},axis:"z",
    gen(a,b,c){const T=1.3,L=[];lin(-T,T,11).filter(x=>Math.abs(x)>.05).forEach(s=>L.push(ellipseZ(a*s,b*s,c*s)));
      lin(0,TAU,17).slice(0,-1).forEach(t=>L.push([[-T*a*Math.cos(t),-T*b*Math.sin(t),-T*c],[T*a*Math.cos(t),T*b*Math.sin(t),T*c]]));return{L}},
    sec(a,b,c,h){if(Math.abs(h)<0.02)return{k:"point",P:[[0,0,0]]};const s=Math.abs(h)/c;return{k:Math.abs(a-b)<.05?"circle":"ellipse",L:[ellipseZ(a*s,b*s,h)]}},
    rev(a,b){return Math.abs(a-b)<.05?254:null}},
  ellCyl:{n:250,eq:"x²/a² + y²/b² = 1",params:["a","b"],defaults:{a:1.3,b:0.8},axis:"z",
    gen(a,b){const H=1.4,L=[];lin(-H,H,7).forEach(z=>L.push(ellipseZ(a,b,z)));lin(0,TAU,19).slice(0,-1).forEach(t=>L.push([[a*Math.cos(t),b*Math.sin(t),-H],[a*Math.cos(t),b*Math.sin(t),H]]));return{L}},
    sec(a,b,_c,h){return{k:Math.abs(a-b)<.05?"circle":"ellipse",L:[ellipseZ(a,b,h)]}},
    rev(a,b){return Math.abs(a-b)<.05?249:null}},
  hypCyl:{n:251,eq:"x²/a² − y²/b² = 1",params:["a","b"],defaults:{a:0.7,b:0.7},axis:"z",
    gen(a,b){const H=1.4,U=1.3,L=[];[1,-1].forEach(sg=>{lin(-H,H,7).forEach(z=>L.push(lin(-U,U,N/2).map(u=>[sg*a*Math.cosh(u),b*Math.sinh(u),z])));
      lin(-U,U,11).forEach(u=>L.push([[sg*a*Math.cosh(u),b*Math.sinh(u),-H],[sg*a*Math.cosh(u),b*Math.sinh(u),H]]))});return{L}},
    sec(a,b,_c,h){const U=1.3;return{k:"hyper",L:[1,-1].map(sg=>lin(-U,U,N/2).map(u=>[sg*a*Math.cosh(u),b*Math.sinh(u),h]))}},
    rev(){return null}},
  parabCyl:{n:252,eq:"y² = 2px",params:["p"],defaults:{c:0.6},axis:"z",
    gen(p){const H=1.4,Y=1.5,L=[];lin(-H,H,7).forEach(z=>L.push(lin(-Y,Y,N/2).map(y=>[y*y/(2*p),y,z])));lin(-Y,Y,13).forEach(y=>L.push([[y*y/(2*p),y,-H],[y*y/(2*p),y,H]]));return{L}},
    sec(p,_b,_c,h){const Y=1.5;return{k:"parab",L:[lin(-Y,Y,N/2).map(y=>[y*y/(2*p),y,h])]}},
    rev(){return null}}
};
const QORDER=["ellipsoid","sphere","hyp1","hyp2","ellParab","hypParab","cone","ellCyl","hypCyl","parabCyl"];
Object.values(QDEF).forEach(q=>q.h0=0.35);

let COL={};
function refreshColors(){const cs=getComputedStyle(document.documentElement);["ink","ink-2","accent","muted","rule","paper-2"].forEach(k=>COL[k]=cs.getPropertyValue("--"+k).trim());if(quadView)quadView.dirty=true;if(mastView)mastView.dirty=true}

function makeView(canvas,opt={}){
  const v={canvas,ctx:canvas.getContext("2d"),yaw:opt.yaw??-0.7,pitch:opt.pitch??0.42,auto:opt.auto??true,dirty:true,scene:null,raf:0,drag:null,axes:opt.axes??true,lw:opt.lw??1};
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(reduce)v.auto=false;
  function size(){const r=canvas.getBoundingClientRect(),dpr=Math.min(2,window.devicePixelRatio||1);const w=Math.max(10,Math.round(r.width*dpr)),h=Math.max(10,Math.round(r.height*dpr));if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h}v.dpr=dpr}
  function draw(){
    const sc=v.scene;if(!sc)return;size();
    const ctx=v.ctx,W=canvas.width,H=canvas.height;ctx.clearRect(0,0,W,H);
    const cy=Math.cos(v.yaw),sy=Math.sin(v.yaw),cp=Math.cos(v.pitch),sp=Math.sin(v.pitch);
    const Rb=sc.R, s=Math.min(W,H)*0.40/Rb, dist=Rb*6;
    const proj=p=>{const x1=p[0]*cy-p[1]*sy,y1=p[0]*sy+p[1]*cy,z1=p[2];const Y=z1*cp+y1*sp,Dp=-z1*sp+y1*cp;const f=dist/(dist+Dp);return[W/2+x1*s*f,H/2-Y*s*f+H*0.02,Dp]};
    const strokeSet=(lines,color,width,minA,dash)=>{
      const bins=Array.from({length:6},()=>[]);
      for(const ln of lines){let prev=proj(ln[0]);for(let i=1;i<ln.length;i++){const cur=proj(ln[i]);const d=((prev[2]+cur[2])/2/Rb+1)/2;const bi=Math.max(0,Math.min(5,Math.floor((1-d)*6)));bins[bi].push(prev,cur);prev=cur}}
      ctx.strokeStyle=color;ctx.lineWidth=width*v.dpr;ctx.lineCap="round";ctx.setLineDash(dash?dash.map(x=>x*v.dpr):[]);
      bins.forEach((b,i)=>{if(!b.length)return;ctx.globalAlpha=minA+(1-minA)*(i/5);ctx.beginPath();for(let j=0;j<b.length;j+=2){ctx.moveTo(b[j][0],b[j][1]);ctx.lineTo(b[j+1][0],b[j+1][1])}ctx.stroke()});
      ctx.globalAlpha=1;ctx.setLineDash([]);
    };
    if(v.axes){
      const A=Rb*1.12;const ax=[[[-A,0,0],[A,0,0],"x"],[[0,-A,0],[0,A,0],"y"],[[0,0,-A],[0,0,A],"z"]];
      strokeSet(ax.map(a=>[a[0],a[1]]),COL["ink-2"],.8,.5,[3,4]);
      ctx.fillStyle=COL["ink-2"];ctx.font=`italic ${15*v.dpr}px "Newsreader", Georgia, serif`;ctx.textAlign="center";ctx.textBaseline="middle";
      ax.forEach(a=>{const p=proj(a[1].map(x=>x*1.07));ctx.fillText(a[2],p[0],p[1])});
    }
    if(sc.plane)strokeSet([sc.plane],COL.accent,1,.35,[2,3]);
    strokeSet(sc.L,COL.ink,v.lw,.18);
    if(sc.R2)strokeSet(sc.R2,COL.accent,v.lw*1.1,.3);
    if(sc.S)strokeSet(sc.S,COL.accent,2.4,.85);
    if(sc.P){ctx.fillStyle=COL.accent;sc.P.forEach(p=>{const q=proj(p);ctx.beginPath();ctx.arc(q[0],q[1],4*v.dpr,0,TAU);ctx.fill()})}
  }
  function loop(){v.raf=requestAnimationFrame(loop);if(v.auto&&!v.drag){v.yaw+=0.0035;v.dirty=true}if(v.dirty){v.dirty=false;draw()}}
  canvas.addEventListener("pointerdown",e=>{if(opt.static)return;v.drag={x:e.clientX,y:e.clientY,yaw:v.yaw,pitch:v.pitch};canvas.setPointerCapture(e.pointerId)});
  canvas.addEventListener("pointermove",e=>{if(!v.drag)return;v.yaw=v.drag.yaw+(e.clientX-v.drag.x)*0.01;v.pitch=Math.max(-1.5,Math.min(1.5,v.drag.pitch+(e.clientY-v.drag.y)*0.01));v.dirty=true});
  const end=()=>{v.drag=null};canvas.addEventListener("pointerup",end);canvas.addEventListener("pointercancel",end);
  v.start=()=>{cancelAnimationFrame(v.raf);loop()};v.stop=()=>cancelAnimationFrame(v.raf);
  v.set=(sc)=>{let R=0;[...sc.L,...(sc.R2||[])].forEach(l=>l.forEach(p=>{R=Math.max(R,Math.abs(p[0]),Math.abs(p[1]),Math.abs(p[2]))}));sc.R=R||1;v.scene=sc;v.dirty=true};
  window.addEventListener("resize",()=>{v.dirty=true});
  return v;
}

let quadView=null, mastView=null;
function stopQuad(){if(quadView){quadView.stop();quadView=null}}
function quadArgs(){const q=S.quad,d=QDEF[q.id];const map={a:q.a,b:q.b,c:q.c,p:q.c,R:q.a};const args=d.params.map(k=>map[k]);while(args.length<3)args.push(1);return args}
function quadScene(){
  const q=S.quad,d=QDEF[q.id],args=quadArgs();
  const g=d.gen(...args);const sc={L:g.L};
  if(d.ruled&&q.rulings)sc.R2=g.R;
  let ext=0;g.L.forEach(l=>l.forEach(p=>{ext=Math.max(ext,Math.abs(p[d.axis==="x"?0:2]))}));
  let lo=-ext,hi=ext;if(q.id==="ellParab"){lo=0}
  if(q.secOn){
    const h=lo+(hi-lo)*(q.h+1)/2;const r=d.sec(...args,h);sc.S=r.L;sc.P=r.P;sc.secKind=r.k;sc.hval=h;
    let m=0;g.L.forEach(l=>l.forEach(p=>{m=Math.max(m,Math.abs(p[0]),Math.abs(p[1]),Math.abs(p[2]))}));m*=1.05;
    sc.plane=d.axis==="x"?[[h,-m,-m],[h,m,-m],[h,m,m],[h,-m,m],[h,-m,-m]]:[[-m,-m,h],[m,-m,h],[m,m,h],[-m,m,h],[-m,-m,h]];
  }
  return sc;
}
function renderQuad(){
  const L=t(), q=S.quad, d=QDEF[q.id], e=byN.get(d.n);
  const nm=x=>{const en=byN.get(QDEF[x].n);return splitTerm(S.lang==="en"?en.en:en.vi)[0]};
  const labels={a:"a",b:"b",c:"c",p:"p",R:"R"};
  const vals={a:q.a,b:q.b,c:q.c,p:q.c,R:q.a};
  view.innerHTML=`<div class="q-grid">
    <div class="q-stage"><canvas id="qc" aria-label="${esc(nm(q.id))}"></canvas><span class="q-hint">${L.qHint}</span></div>
    <div>
      <p class="lbl">${L.qPick}</p>
      <div class="q-pick">${QORDER.map(x=>`<button data-q="${x}" aria-pressed="${x===q.id}">${esc(nm(x))}</button>`).join("")}</div>
      <h2 class="q-title">${esc(splitTerm(S.lang==="en"?e.en:e.vi)[0])}</h2>
      <p class="q-sub">${esc(splitTerm(S.lang==="en"?e.vi:e.en)[0])}</p>
      <div class="eq" id="qeq">${d.eq}</div>
      <p class="eq-num" id="qeqn"></p>
      <span id="qrev"></span>
      ${d.params.map(k=>`<div class="ctrl"><label for="qp-${k}">${labels[k]}</label><input id="qp-${k}" type="range" min="0.3" max="2.2" step="0.05" value="${vals[k]}" data-p="${k}"><output id="qo-${k}">${(+vals[k]).toFixed(2)}</output></div>`).join("")}
      <label class="check"><input type="checkbox" id="qsec" ${q.secOn?"checked":""}> ${L.qSection} ${d.axis==="x"?"x":"z"} = h</label>
      <div class="ctrl"><label for="qh">h</label><input id="qh" type="range" min="-1" max="1" step="0.01" value="${q.h}" ${q.secOn?"":"disabled"}><output id="qho"></output></div>
      <p class="section-note" id="qnote"></p>
      ${d.ruled?`<label class="check"><input type="checkbox" id="qrul" ${q.rulings?"checked":""}> ${L.qRulings}</label>`:""}
      <label class="check"><input type="checkbox" id="qauto" ${q.auto?"checked":""}> ${L.qAuto}</label>
      <div class="q-links"><button class="btn" data-go="${d.n}">${L.qOpen} № ${d.n}</button><button class="btn" id="qreset">${L.qResetView}</button></div>
    </div></div>`;
  const cv=$("#qc");quadView=makeView(cv,{auto:q.auto,lw:1.1});
  const update=()=>{
    const sc=quadScene();quadView.set(sc);
    const args=quadArgs();
    $("#qeqn").textContent=`${L.with} `+d.params.map((k,i)=>`${k} = ${args[i].toFixed(2)}`).join(", ");
    const r=d.rev(...args);$("#qrev").innerHTML=r?`<button class="rev chip" data-go="${r}">${L.qRev} · #${r}</button>`:"";
    if(q.secOn){$("#qho").textContent=sc.hval.toFixed(2);const kmap={none:L.secNone,point:L.secPoint,ellipse:L.secEllipse,circle:L.secCircle,hyper:L.secHyper,lines:L.secLines,parab:L.secParab};$("#qnote").innerHTML=`${d.axis==="x"?"x":"z"} = ${sc.hval.toFixed(2)}: ${kmap[sc.secKind]}`}
    else{$("#qho").textContent="";$("#qnote").textContent=""}
  };
  update();quadView.start();
  view.querySelector(".q-pick").addEventListener("click",ev=>{const b=ev.target.closest("[data-q]");if(!b)return;const id=b.dataset.q;Object.assign(S.quad,{id,a:1.3,b:1,c:1},QDEF[id].defaults);stopQuad();renderQuad()});
  view.querySelectorAll("[data-p]").forEach(inp=>inp.addEventListener("input",()=>{const k=inp.dataset.p,v=+inp.value;if(k==="a"||k==="R")q.a=v;else if(k==="b")q.b=v;else q.c=v;$("#qo-"+k).textContent=v.toFixed(2);update()}));
  $("#qsec").addEventListener("change",ev=>{q.secOn=ev.target.checked;$("#qh").disabled=!q.secOn;update()});
  $("#qh").addEventListener("input",ev=>{q.h=+ev.target.value;update()});
  const rul=$("#qrul");if(rul)rul.addEventListener("change",ev=>{q.rulings=ev.target.checked;update()});
  $("#qauto").addEventListener("change",ev=>{q.auto=ev.target.checked;quadView.auto=q.auto});
  $("#qreset").addEventListener("click",()=>{quadView.yaw=-0.7;quadView.pitch=0.42;quadView.dirty=true});
}

function boot(data){
  D=data;D.entries.forEach(e=>byN.set(e.n,e));buildIndex();
  document.documentElement.lang=S.lang;document.body.classList.toggle("lang-en",S.lang==="en");
  $("#langVi").setAttribute("aria-pressed",S.lang==="vi");$("#langEn").setAttribute("aria-pressed",S.lang==="en");
  refreshColors();
  const h=(location.hash||"").slice(1);
  if(VIEWS.includes(h))S.view=h;
  renderChrome();render();
  const m=h.match(/^n(\d+)$/);if(m)openEntry(+m[1]);
  const setBar=()=>document.documentElement.style.setProperty("--bar-h",$("#bar").offsetHeight+"px");setBar();window.addEventListener("resize",setBar);
  // masthead drawing
  const mc=$("#mastCanvas");
  if(mc&&getComputedStyle(mc.parentElement).display!=="none"){
    mastView=makeView(mc,{auto:true,axes:false,static:true,pitch:0.32,lw:.9});
    const g=QDEF.hyp1.gen(1,1,1.05);mastView.set({L:g.L});mastView.start();
  }
}

let printRestore=null;
function afterPrint(){document.body.classList.remove("print-one");document.querySelectorAll(".entry.printing").forEach(a=>a.classList.remove("printing"));if(printRestore){S.open=printRestore;printRestore=null;render()}}
window.addEventListener("afterprint",afterPrint);
function printAll(){
  if(S.view==="browse"||S.view==="saved"){
    printRestore=new Set(S.open);
    const qn=currentQn();let list;
    if(S.view==="saved")list=[...S.favs].map(n=>byN.get(n)).filter(Boolean);
    else if(qn)list=search(S.q).map(r=>r.e);
    else list=D.entries.filter(e=>(!S.chapter||e.chapter===S.chapter)&&(!S.section||e.section===S.section));
    list.forEach(e=>S.open.add(e.n));render();
  }
  setTimeout(()=>window.print(),60);
}
function printEntry(art){
  art.classList.add("printing");document.body.classList.add("print-one");
  if(!S.open.has(+art.dataset.n)){S.open.add(+art.dataset.n);printRestore=printRestore||null}
  setTimeout(()=>window.print(),30);
}
view.addEventListener("click",ev=>{
  if(ev.target.closest("[data-print]")){printAll();return}
  const g=ev.target.closest("[data-go]");
  if(g){openEntry(+g.dataset.go);return}
  if(ev.target.closest(".entry"))entryClick(ev);
});
window.addEventListener("hashchange",()=>{
  if(!D)return;const h=(location.hash||"").slice(1);
  if(VIEWS.includes(h)&&h!==S.view){go(h,{keepScroll:true})}

});

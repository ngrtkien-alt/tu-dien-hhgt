  --rule:#EADBE0;        /* đường kẻ mảnh */
  --muted:#D3BEC6;       /* nét trang trí, viền ô nhập */
  --ink:#2A1A20;         /* chữ thân bài */
  --ink-2:#6A545E;       /* chữ phụ */
  --brand:#8B1E3F;       /* đỏ đô: tiêu đề, từ khóa */
  --brand-soft:#FBEFF2;  /* nền nhạt của đỏ đô */
  --band:#8B1E3F;        /* dải màu đặc (tiêu đề chương, chân trang) */
  --on-band:#FFFFFF;
  --accent:#1D6FD8;      /* xanh lam: liên kết, nút, vạch nhấn */
  --accent-ink:#1558B0;  /* xanh lam đậm: chữ nhấn */
  --accent-soft:#E7F0FD; /* nền nhạt của xanh lam */
  --on-accent:#FFFFFF;
  --focus:#1D6FD8;
  --hero-a:#6B112E;--hero-b:#A22350;--hero-ink:#FFFFFF;--hero-ink-2:#F6D3DE;--hero-accent:#A8D0FF;
  --shadow:0 1px 2px rgba(80,15,35,.07),0 10px 26px rgba(80,15,35,.10);
  --shadow-s:0 1px 2px rgba(80,15,35,.07);
  --f-body:"Be Vietnam Pro","Segoe UI",system-ui,-apple-system,Roboto,"Noto Sans","Helvetica Neue",Arial,sans-serif;
  --f-display:var(--f-body);
  --f-mono:var(--f-body);
  --f-math:"Newsreader","Cambria","Times New Roman","Noto Serif",serif;
  --bar-h:120px;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#140E12;--paper-2:#1D1419;--card:#1A1216;--rule:#38262E;--muted:#5A4450;--ink:#F5EDF0;--ink-2:#C9B4BD;
    --brand:#FF9DBA;--brand-soft:rgba(255,157,186,.09);--band:#5A1630;--on-band:#FFFFFF;
    --accent:#5CA3FF;--accent-ink:#8FC0FF;--accent-soft:rgba(92,163,255,.15);--on-accent:#08182E;--focus:#8FC0FF;
    --hero-a:#2E0A18;--hero-b:#5A1630;--hero-ink:#FFFFFF;--hero-ink-2:#EBC6D3;--hero-accent:#9CC9FF;
    --shadow:0 1px 2px rgba(0,0,0,.45),0 10px 26px rgba(0,0,0,.4);--shadow-s:0 1px 2px rgba(0,0,0,.45);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#140E12;--paper-2:#1D1419;--card:#1A1216;--rule:#38262E;--muted:#5A4450;--ink:#F5EDF0;--ink-2:#C9B4BD;
  --brand:#FF9DBA;--brand-soft:rgba(255,157,186,.09);--band:#5A1630;--on-band:#FFFFFF;
  --accent:#5CA3FF;--accent-ink:#8FC0FF;--accent-soft:rgba(92,163,255,.15);--on-accent:#08182E;--focus:#8FC0FF;
  --hero-a:#2E0A18;--hero-b:#5A1630;--hero-ink:#FFFFFF;--hero-ink-2:#EBC6D3;--hero-accent:#9CC9FF;
  --shadow:0 1px 2px rgba(0,0,0,.45),0 10px 26px rgba(0,0,0,.4);--shadow-s:0 1px 2px rgba(0,0,0,.45);color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.66;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
::selection{background:var(--accent);color:var(--on-accent)}
a{color:var(--accent-ink);text-decoration-color:var(--accent);text-decoration-thickness:2px;text-underline-offset:3px}
.gutter{padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.inner{max-width:1240px;margin:0 auto}
.skip{position:absolute;left:-999px;top:0;background:var(--accent);color:var(--on-accent);padding:.5rem 1rem;z-index:60}
.skip:focus{left:8px;top:8px}

/* ---------- vectơ có mũi tên & chỉ số dưới ---------- */
.vg{white-space:nowrap}
.vec{position:relative;display:inline-block;line-height:1;padding-top:.08em;margin-top:-.08em;font-style:normal;white-space:nowrap}
.vec::before{content:"";position:absolute;left:.03em;right:.05em;top:.02em;border-top:.07em solid currentColor}
.vec::after{content:"";position:absolute;right:.03em;top:.02em;width:.25em;height:.25em;border:solid currentColor;border-width:.07em .07em 0 0;transform:translateY(-50%) rotate(45deg) scale(.9)}
.vec.lc{padding-top:.2em;margin-top:-.2em}
.vec.lc::before,.vec.lc::after{top:.14em}
sub{font-size:.72em;line-height:0;vertical-align:-.28em}

/* ---------- thanh đầu trang (logo · menu · ngôn ngữ · tìm kiếm) ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-top:4px solid var(--band);border-bottom:1px solid var(--rule);box-shadow:0 8px 18px -14px rgba(80,15,35,.5)}
@supports (backdrop-filter:blur(8px)){.bar{background:color-mix(in srgb,var(--paper) 94%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}}
.bar-top .inner{display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"brand tabs tools";gap:6px 18px;align-items:center;padding-block:8px}
.brand{grid-area:brand;display:flex;align-items:center;gap:11px;text-decoration:none;color:var(--ink);min-width:0}
.logo{width:40px;height:40px;flex:none;display:block}
.logo .bg{fill:var(--band)}
.logo .ax{stroke:#F6C6D4;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.logo .el{stroke:#FFFFFF;fill:none;stroke-width:2.2}
.logo .fc{fill:#7DB8FF}
.brand-t{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.brand-t b{font-size:1.05rem;font-weight:700;color:var(--brand);letter-spacing:-.005em;white-space:nowrap}
.brand-t small{font-size:.72rem;color:var(--ink-2);font-weight:500;white-space:nowrap}
.tabs{grid-area:tabs;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:0;padding:0}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;background:none;border:0;border-bottom:3px solid transparent;border-radius:0;padding:.55rem .8rem .5rem;cursor:pointer;font-size:.9rem;color:var(--ink-2);white-space:nowrap;font-weight:600;transition:color .15s,border-color .15s,background .15s}
.tab:hover{color:var(--brand);background:var(--brand-soft)}
.tab[aria-selected="true"]{color:var(--brand);border-bottom-color:var(--accent);font-weight:700}
.tab .count{font-size:.72rem;margin-left:6px;background:var(--accent);color:var(--on-accent);border-radius:999px;padding:0 .45rem}
.bar-tools{grid-area:tools;display:flex;gap:8px;align-items:center}
.seg{display:inline-flex;background:var(--paper-2);border:1px solid var(--rule);border-radius:999px;padding:2px;flex:none}
.seg button{background:none;border:0;border-radius:999px;padding:.5rem .8rem;font-size:.78rem;cursor:pointer;letter-spacing:.05em;color:var(--ink-2);font-weight:600}
.seg button:hover{color:var(--brand)}
.seg button[aria-pressed="true"]{background:var(--band);color:var(--on-band)}
.iconbtn{flex:none;background:var(--paper-2);border:1px solid var(--rule);border-radius:50%;width:2.4rem;height:2.4rem;display:grid;place-items:center;cursor:pointer;transition:background .15s}
.iconbtn:hover{background:var(--brand-soft)}
.iconbtn svg{width:19px;height:19px;stroke:var(--brand);fill:none}
.bar-search .inner{padding-block:2px 12px}

/* ---------- ô tìm kiếm ---------- */
.search{position:relative;min-width:0;max-width:760px}
.search input{width:100%;height:48px;background:var(--card);border:2px solid var(--muted);border-radius:10px;padding:0 5.6rem 0 1rem;font-family:var(--f-body);font-size:1rem;transition:border-color .15s,box-shadow .15s}
.search input:hover{border-color:var(--ink-2)}
.search input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 25%,transparent)}
.search input::placeholder{color:var(--ink-2);opacity:.85}
.search .sbtn{position:absolute;right:5px;top:5px;bottom:5px;width:38px;border:0;border-radius:7px;background:var(--accent);color:var(--on-accent);cursor:pointer;display:grid;place-items:center;transition:filter .15s}
.search .sbtn:hover{filter:brightness(1.1)}
.search .sbtn svg{width:19px;height:19px;stroke:currentColor;fill:none}
.search .clear{position:absolute;right:48px;top:50%;transform:translateY(-50%);background:none;border:0;cursor:pointer;color:var(--ink-2);width:2rem;height:2rem;border-radius:50%}
.search .clear:hover{background:var(--brand-soft);color:var(--brand)}
.search kbd{position:absolute;right:52px;top:50%;transform:translateY(-50%);font-size:.72rem;color:var(--ink-2);border:1px solid var(--muted);border-radius:6px;padding:0 .4rem;background:var(--paper-2)}
.search input::-webkit-search-cancel-button,.search input::-webkit-search-decoration{-webkit-appearance:none;appearance:none;display:none}
.search.big{max-width:720px}
.search.big input{height:60px;border-radius:14px;border-color:transparent;font-size:1.12rem;padding-left:1.3rem;padding-right:6.4rem;box-shadow:0 14px 34px -12px rgba(30,0,12,.55);color:var(--ink);background:#fff}
.search.big input::placeholder{color:#7a6670}
.search.big input:focus{border-color:var(--hero-accent);box-shadow:0 0 0 4px rgba(168,208,255,.45),0 14px 34px -12px rgba(30,0,12,.55)}
.search.big .sbtn{right:7px;top:7px;bottom:7px;width:46px;border-radius:10px}
.search.big .clear{right:58px}
.search.big kbd{right:62px}
:root[data-theme="dark"] .search.big input{background:#1D1419;color:#F5EDF0}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .search.big input{background:#1D1419;color:#F5EDF0}}

/* ---------- gợi ý khi gõ ---------- */
.search.big .sugg{max-height:min(54vh,430px)}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 8px);background:var(--card);border:1px solid var(--rule);border-radius:14px;box-shadow:0 22px 44px -14px rgba(50,0,20,.5);z-index:40;max-height:min(70vh,540px);overflow:auto;color:var(--ink)}
.sg-item{display:grid;grid-template-columns:4rem minmax(0,1fr);column-gap:8px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--rule);padding:.6rem .9rem;cursor:pointer;align-items:baseline}
.sg-item:hover,.sg-item[aria-selected="true"]{background:var(--accent-soft)}
.sg-item .num{margin-top:0;font-size:.7rem}
.sg-t{display:flex;flex-wrap:wrap;gap:0 8px;align-items:baseline;min-width:0}
.sg-t .en{font-size:1.04rem}
.sg-t .vi{font-size:.95rem}
.sg-meta{grid-column:2;font-size:.7rem;color:var(--ink-2);margin-top:1px}
.sg-all{display:block;width:100%;text-align:left;background:var(--paper-2);border:0;padding:.75rem .9rem;font-size:.84rem;font-weight:700;cursor:pointer;color:var(--accent-ink)}
.sg-all:hover{background:var(--accent-soft)}
.sg-none{padding:.9rem;color:var(--ink-2);font-size:.92rem}

/* ---------- trang đầu: hero ---------- */
.mast{position:relative;color:var(--hero-ink);background:linear-gradient(120deg,var(--hero-a) 0%,var(--hero-b) 100%);border-bottom:4px solid var(--accent);padding-block:46px 40px;display:none}
body[data-view="about"] .mast{display:block}
.mast::before{content:"";position:absolute;inset:0;pointer-events:none;background:var(--mathbg) right center/auto 100% no-repeat,linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px) 0 0/40px 40px,linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px) 0 0/40px 40px;-webkit-mask-image:linear-gradient(95deg,transparent 0%,rgba(0,0,0,.35) 28%,#000 62%);mask-image:linear-gradient(95deg,transparent 0%,rgba(0,0,0,.35) 28%,#000 62%)}
.mast-in{position:relative;z-index:2;display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:36px;align-items:center}
.kicker{font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;color:var(--hero-accent);margin:0 0 12px;font-weight:600;display:flex;align-items:center;gap:10px}
.kicker::before{content:"";width:26px;height:3px;background:var(--hero-accent);border-radius:2px;flex:none}
.mast h1{font-weight:800;font-size:clamp(2.2rem,5.4vw,3.7rem);line-height:1.06;margin:0;text-wrap:balance;letter-spacing:-.02em;color:var(--hero-ink)}
.mast h1 em{font-style:normal;color:var(--hero-accent)}
.mast-sub{text-wrap:pretty;margin:14px 0 22px;color:var(--hero-ink-2);font-size:1rem;max-width:62ch}
.mast-try{margin:16px 0 0;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.84rem;color:var(--hero-ink-2)}
.mast-try b{font-weight:600;margin-right:2px}
.mast-try a{color:var(--hero-ink);background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:.42rem .9rem;text-decoration:none;font-weight:500;transition:background .15s,border-color .15s}
.mast-try a:hover{background:rgba(168,208,255,.28);border-color:var(--hero-accent)}
.stats{display:flex;flex-wrap:wrap;gap:8px 10px;margin:22px 0 0;padding:0;font-size:.8rem;color:var(--hero-ink-2)}
.stats div{display:flex;gap:6px;align-items:baseline;padding:0 .2rem 0 0}
.stats div+div::before{content:"";width:1px;height:.9em;background:rgba(255,255,255,.35);align-self:center;margin-right:8px}
.stats dt{order:2;margin:0}
.stats dd{order:1;margin:0;color:var(--hero-ink);font-weight:700;font-variant-numeric:tabular-nums}
.mast-fig{margin:0;text-align:center}
.mast-fig canvas{width:230px;height:230px;display:block;margin:0 auto}
.mast-fig figcaption{font-size:.7rem;color:var(--hero-ink-2);letter-spacing:.04em}
.mast-meta{margin:12px 0 0;font-size:.8rem;color:var(--hero-ink-2);display:flex;flex-wrap:wrap;gap:2px 16px}
.ph{outline:1px dashed currentColor;outline-offset:2px;color:var(--accent-ink)}
.mast .ph{color:var(--hero-accent)}
body[data-view="about"] .bar-search{display:none}

/* ---------- bố cục chung ---------- */
main{padding-block:28px 72px;min-height:calc(100vh - 380px)}
.layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:40px;align-items:start}
.toc{position:sticky;top:calc(var(--bar-h) + env(safe-area-inset-top,0px) + 16px);max-height:calc(100vh - var(--bar-h) - 40px);max-height:calc(100dvh - var(--bar-h) - 40px);overflow:auto;font-size:.9rem;padding-right:6px}
.toc h2{font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--brand);font-weight:700;margin:0 0 8px}
.toc ul{list-style:none;margin:0;padding:0}
.toc button{width:100%;text-align:left;background:none;border:0;border-left:3px solid transparent;border-radius:0 8px 8px 0;cursor:pointer;padding:.45rem .55rem;display:grid;grid-template-columns:2.4rem 1fr auto;gap:4px;align-items:baseline;line-height:1.35;color:var(--ink-2)}
.toc button:hover{color:var(--brand);background:var(--brand-soft)}
.toc button[aria-current="true"]{color:var(--brand);background:var(--accent-soft);border-left-color:var(--accent);font-weight:700}
.toc .sec-n,.toc .cnt{font-size:.72rem;font-variant-numeric:tabular-nums}
.toc .cnt{color:var(--accent-ink);font-weight:700}
.toc .ch{font-size:.98rem;color:var(--brand);margin-top:14px;font-weight:700}
.toc .ch .sec-n{font-size:.75rem}
.mobile-filter{display:none}
.mobile-filter select{width:100%;background:var(--card);border:2px solid var(--muted);border-radius:10px;padding:.65rem .8rem;font-family:var(--f-body)}
.lbl{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);margin:0 0 8px;font-weight:700}

.toolbar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin:0 0 16px}
.toolbar p{margin:0;font-size:.84rem;color:var(--ink-2);font-weight:500}
.btn{background:var(--card);border:1.5px solid var(--muted);color:var(--accent-ink);border-radius:999px;padding:.4rem .95rem;font-size:.82rem;font-weight:600;cursor:pointer;display:inline-flex;gap:7px;align-items:center;white-space:nowrap;transition:border-color .15s,background .15s,transform .1s}
.btn:hover{border-color:var(--accent);background:var(--accent-soft)}
.btn:active{transform:translateY(1px)}
.btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none}
.btn[aria-pressed="true"] svg{fill:currentColor}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.1)}

/* chương & mục */
.chap-h{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;background:var(--band);color:var(--on-band);border-radius:12px;padding:14px 20px;margin:40px 0 8px}
.chap-h:first-child{margin-top:0}
.chap-h .no{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--band);background:var(--on-band);border-radius:999px;padding:.12rem .75rem;font-weight:800}
.chap-h h2{font-weight:800;font-size:1.5rem;line-height:1.2;margin:0;text-wrap:balance;color:var(--on-band)}
.chap-h .alt{color:rgba(255,255,255,.78);font-size:.92rem;font-style:italic}
.sec-h{margin:28px 0 6px;display:grid;grid-template-columns:3.4rem 1fr;gap:2px 10px;align-items:baseline;padding-bottom:8px;border-bottom:2px solid var(--rule)}
.sec-h .no{font-size:.82rem;color:var(--accent-ink);font-weight:700;background:var(--accent-soft);border-radius:6px;padding:.08rem .5rem;justify-self:start}
.sec-h h3{font-size:1.22rem;font-weight:700;margin:0;line-height:1.3;text-wrap:balance;color:var(--brand)}
.sec-h p{grid-column:2;margin:0;color:var(--ink-2);font-style:italic;font-size:.9rem}
.sec-h .note{font-style:normal;font-size:.7rem}

/* ---------- danh sách mục từ ---------- */
.entries{display:block}
.entry{border-bottom:1px solid var(--rule);background:transparent;transition:background .15s}
.entry:hover{background:var(--paper-2)}
.entry-row{--numw:4.4rem;--gap:12px;display:grid;grid-template-columns:var(--numw) minmax(0,1fr) auto;gap:var(--gap);align-items:start;padding-inline:10px 4px;border-left:4px solid transparent;transition:border-color .15s}
.entry:hover .entry-row{border-left-color:var(--accent)}
.num{font-size:.72rem;color:var(--brand);font-weight:700;background:var(--brand-soft);border-radius:6px;padding:.1rem .5rem;margin-top:.9rem;font-variant-numeric:tabular-nums;white-space:nowrap;justify-self:start;align-self:start;line-height:1.55}
.terms{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px}
.en{font-size:1.14rem;font-weight:700;line-height:1.3;color:var(--brand)}
.var{color:var(--ink-2);font-size:.9em;font-style:italic;font-weight:400}
.arrow{color:var(--accent);font-size:.95rem;font-weight:700}
.vi{font-weight:600;font-size:1rem;line-height:1.35;color:var(--ink)}
.pos{font-size:.68rem;background:var(--paper-2);border:1px solid var(--rule);border-radius:4px;padding:0 7px;color:var(--ink-2);align-self:center;font-weight:600}
.lang-en .vi{font-weight:400;font-style:italic}
.preview{display:block;color:var(--ink-2);font-size:.88rem;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.match-def{font-size:.68rem;color:var(--accent-ink);margin-left:2px}
mark{background:transparent;color:inherit;box-shadow:inset 0 -.5em 0 color-mix(in srgb,var(--accent) 32%,transparent);border-radius:2px}
.star{background:none;border:0;cursor:pointer;padding:.75rem .6rem .5rem;color:var(--ink-2);border-radius:50%}
.star:hover{color:var(--accent)}
.star svg{width:20px;height:20px;stroke:currentColor;fill:none}
.star[aria-pressed="true"]{color:var(--accent)}
.star[aria-pressed="true"] svg{fill:currentColor}
.rowlink{grid-column:1/3;display:grid;grid-template-columns:var(--numw) minmax(0,1fr);column-gap:var(--gap);color:inherit;text-decoration:none;min-width:0}
.rowmain{display:block;padding:.7rem 0;min-width:0}
.rowlink:hover .terms .en{text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:2px;text-underline-offset:4px}
.entry-body{padding:4px 12px 22px calc(4.4rem + 24px)}
.defs{display:grid;grid-template-columns:1fr 1fr;gap:10px 30px}
.blk{margin-top:14px}
.para{margin:0;max-width:64ch;min-width:0;overflow-wrap:anywhere}
.para .tag{font-size:.64rem;font-weight:700;background:var(--band);color:var(--on-band);border-radius:4px;padding:.08rem .45rem;margin-right:8px;vertical-align:2px;letter-spacing:.04em}
.defs .para:nth-child(2) .tag{background:var(--accent);color:var(--on-accent)}
.ex .para{font-size:.97rem}
.meta{display:grid;grid-template-columns:7.5rem minmax(0,1fr);gap:8px 14px;margin-top:18px;padding-top:14px;border-top:1px dashed var(--muted);font-size:.92rem}
.meta dt{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);padding-top:.3rem;font-weight:700}
.meta dd{margin:0;display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.chip{background:var(--card);border:1.5px solid var(--muted);border-radius:999px;padding:.14rem .75rem;cursor:pointer;font-size:.86rem;text-align:left;color:var(--ink);transition:border-color .15s,background .15s}
.chip:hover{border-color:var(--accent);background:var(--accent-soft)}
.chip b{font-weight:700;font-size:.72rem;color:var(--accent-ink);margin-right:5px}
.chip.off{cursor:default;color:var(--ink-2);border-style:dashed;background:transparent}
.chip.off:hover{border-color:var(--muted);background:transparent}
.src{font-style:italic;color:var(--ink-2);overflow-wrap:anywhere}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.empty{border:2px dashed var(--muted);border-radius:var(--r);padding:32px;text-align:center;color:var(--ink-2)}
.empty strong{display:block;font-size:1.25rem;color:var(--brand);font-weight:700;margin-bottom:6px}

/* ---------- bảng tra A–Z ---------- */
.letters{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 18px}
.letters button{font-size:.84rem;font-weight:700;min-width:2.4rem;height:2.4rem;padding:0 .5rem;background:var(--card);border:1.5px solid var(--muted);border-radius:8px;cursor:pointer;color:var(--brand)}
.letters button:hover{border-color:var(--accent);background:var(--accent-soft)}
.tablewrap{overflow-x:auto;border:1px solid var(--rule);border-radius:var(--r);background:var(--card)}
table.lookup{width:100%;border-collapse:collapse;font-size:.95rem}
.lookup th{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--on-band);font-weight:700;text-align:left;background:var(--band);padding:.65rem .8rem}
.lookup td{border-bottom:1px solid var(--rule);padding:.5rem .8rem;vertical-align:top}
.lookup tbody tr:hover td{background:var(--accent-soft)}
.lookup td:first-child{font-size:1.02rem;font-weight:700;color:var(--brand)}
.lookup td:nth-child(2){color:var(--ink)}
.lookup td:last-child{white-space:nowrap;text-align:right}
.lookup tr.grp td{text-align:left;white-space:normal;font-size:1.35rem;font-weight:800;color:var(--brand);background:var(--brand-soft);padding-block:.45rem;border-bottom:2px solid var(--rule)}
.lookup tr.grp:hover td{background:var(--brand-soft)}
.nlink{background:var(--accent-soft);border:0;cursor:pointer;font-size:.76rem;font-weight:700;color:var(--accent-ink);padding:.12rem .55rem;border-radius:6px;margin-left:2px}
.nlink:hover{background:var(--accent);color:var(--on-accent)}

/* ---------- 3D ---------- */
.q-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:28px;align-items:start}
.q-stage{border:1px solid var(--rule);border-radius:16px;background:var(--card);box-shadow:var(--shadow);position:relative;overflow:hidden}
.q-stage canvas{display:block;width:100%;aspect-ratio:4/3;max-width:100%;touch-action:none;cursor:grab}
.q-stage canvas:active{cursor:grabbing}
.q-hint{position:absolute;left:14px;bottom:10px;font-size:.7rem;color:var(--ink-2)}
.q-pick{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.q-pick button{background:var(--card);border:1.5px solid var(--muted);border-radius:999px;padding:.5rem .9rem;font-size:.86rem;cursor:pointer;color:var(--ink);font-weight:500}
.q-pick button:hover{border-color:var(--accent)}
.q-pick button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--on-accent);font-weight:700}
.q-title{font-size:1.7rem;line-height:1.15;margin:0;font-weight:800;color:var(--brand)}
.q-sub{color:var(--ink-2);font-style:italic;margin:2px 0 0}
.eq{font-family:var(--f-math);font-size:1.3rem;margin:16px 0 4px;padding:10px 14px;border:1px solid var(--rule);border-left:4px solid var(--accent);border-radius:10px;background:var(--paper-2);overflow-x:auto;white-space:nowrap}
.eq-num{font-size:.78rem;color:var(--ink-2)}
.ctrl{display:grid;grid-template-columns:2.2rem 1fr 3rem;gap:10px;align-items:center;margin:10px 0}
.ctrl label{font-family:var(--f-math);font-style:italic;font-size:1.15rem}
.ctrl output{font-size:.82rem;text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;-webkit-appearance:none;appearance:none;background:transparent;height:28px;cursor:pointer;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:999px;background:var(--muted)}
input[type=range]::-moz-range-track{height:6px;border-radius:999px;background:var(--muted)}
input[type=range]::-moz-range-progress{height:6px;border-radius:999px;background:var(--accent)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:22px;height:22px;margin-top:-8px;border-radius:50%;background:var(--accent);border:3px solid var(--card);box-shadow:0 0 0 1.5px var(--brand),0 2px 6px rgba(80,15,35,.35)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--accent);border:3px solid var(--card);box-shadow:0 0 0 1.5px var(--brand)}
input[type=range]:disabled{opacity:.45;cursor:not-allowed}
input[type=range]:focus-visible{outline:2px solid var(--focus);outline-offset:3px;border-radius:999px}
.check{display:flex;gap:8px;align-items:center;margin:8px 0;font-size:.95rem;cursor:pointer}
.check input{accent-color:var(--accent);width:17px;height:17px}
.section-note{font-size:.92rem;color:var(--ink-2);margin:4px 0 0;min-height:1.5em}
.section-note b{color:var(--brand);font-weight:700}
.rev{display:inline-block;margin-top:8px;font-size:.76rem}
.q-links{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}

/* ---------- flashcard ---------- */
.fc-wrap{max-width:740px;margin:0 auto}
.fc-opts{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin-bottom:22px}
.fc-opts label{font-size:.8rem;color:var(--ink-2);display:flex;gap:8px;align-items:center;font-weight:600}
.fc-opts select{background:var(--card);border:1.5px solid var(--muted);border-radius:8px;padding:.4rem .6rem;font-family:var(--f-body);font-size:.92rem}
.fcard{position:relative;background:var(--card);border:1px solid var(--rule);border-top:6px solid var(--band);border-radius:18px;box-shadow:var(--shadow);min-height:320px;padding:48px 30px 34px;cursor:pointer;transition:transform .2s,box-shadow .2s}
.fcard:hover{transform:translateY(-2px)}
.fcard .corner{position:absolute;top:14px;left:20px;right:20px;display:flex;justify-content:space-between;font-size:.74rem;color:var(--ink-2);font-weight:600}
.fcard .corner>span:last-child{background:var(--accent);color:var(--on-accent);border-radius:4px;padding:0 .6rem;font-weight:700}
.fcard .front{font-size:clamp(1.7rem,4.8vw,2.5rem);line-height:1.2;text-align:center;margin:36px 0 0;text-wrap:balance;font-weight:800;color:var(--brand)}
.fcard .back{text-align:center;margin-top:20px;border-top:2px dashed var(--muted);padding-top:18px}
.fcard .back .other{font-weight:700;font-size:1.35rem;color:var(--accent-ink)}
.fcard .back p{color:var(--ink-2);max-width:56ch;margin:12px auto 0;font-size:.96rem;text-align:left}
.fcard .hint{position:absolute;bottom:12px;left:0;right:0;text-align:center;font-size:.72rem;color:var(--ink-2)}
.fc-actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:26px}
.fc-progress{text-align:center;font-size:.82rem;color:var(--ink-2);margin-top:14px}
.fade{animation:fade .25s ease}
@keyframes fade{from{opacity:.2}to{opacity:1}}

/* ---------- trang chủ: quy ước, nguồn, duyệt chương, công cụ ---------- */
.home{display:grid;gap:44px}
.hsec>h2{font-size:1.5rem;font-weight:800;color:var(--brand);margin:0 0 16px;display:flex;align-items:center;gap:12px}
.hsec>h2::before{content:"";width:6px;height:26px;background:var(--accent);border-radius:3px;flex:none}
.hsec h3{font-size:1rem;font-weight:700;color:var(--brand);margin:0 0 10px}
.hgrid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:28px;align-items:start}
.conv,.facts{display:grid;grid-template-columns:8.5rem minmax(0,1fr);border:1px solid var(--rule);border-radius:var(--r);overflow:hidden;background:var(--card);margin:0}
.conv dt,.conv dd,.facts dt,.facts dd{border-bottom:1px solid var(--rule);padding:.7rem 1rem;margin:0}
.conv dt:nth-last-of-type(1),.conv dd:last-of-type,.facts dt:nth-last-of-type(1),.facts dd:last-of-type{border-bottom:0}
.conv dt,.facts dt{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--brand);background:var(--brand-soft);font-weight:700}
.conv dd,.facts dd{font-size:.95rem}
.srcs{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.srcs li{background:var(--card);border:1px solid var(--rule);border-left:4px solid var(--accent);border-radius:10px;padding:.7rem 1rem;font-size:.93rem}
.srcs b{font-weight:700;color:var(--brand)}
.ccs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.cc{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;align-items:center;text-align:left;background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:16px 18px;cursor:pointer;box-shadow:var(--shadow-s);transition:border-color .15s,box-shadow .2s,transform .2s}
.cc:hover{border-color:var(--accent);box-shadow:var(--shadow);transform:translateY(-2px)}
.cc-n{grid-row:1/3;width:46px;height:46px;border-radius:12px;background:var(--band);color:var(--on-band);font-size:1.5rem;font-weight:800;display:grid;place-items:center}
.cc-t{display:flex;flex-direction:column;min-width:0;line-height:1.3}
.cc-t b{font-size:1.04rem;color:var(--brand);font-weight:700}
.cc-t small{font-size:.8rem;color:var(--ink-2);font-style:italic}
.cc-c{font-size:.78rem;color:var(--accent-ink);font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.tile{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:18px;cursor:pointer;box-shadow:var(--shadow-s);transition:border-color .15s,box-shadow .2s,transform .2s}
.tile:hover{border-color:var(--accent);box-shadow:var(--shadow);transform:translateY(-2px)}
.tile .ti{width:42px;height:42px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center;margin-bottom:4px}
.tile .ti svg{width:22px;height:22px;stroke:var(--accent-ink);fill:none;stroke-width:1.8}
.tile b{font-size:1rem;color:var(--brand);font-weight:700}
.tile span{font-size:.86rem;color:var(--ink-2);line-height:1.45}
.tips{padding-left:1.2rem;margin:0}
.tips li{margin:.4rem 0}
.tips li::marker{color:var(--accent)}
.team{list-style:none;margin:12px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px 14px;counter-reset:m}
.team li{counter-increment:m;background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:.5rem .8rem}
.team li::before{content:counter(m,decimal-leading-zero);font-size:.72rem;font-weight:700;color:var(--on-accent);background:var(--accent);border-radius:4px;padding:0 .4rem;margin-right:10px}
kbd.k{font-size:.78rem;border:1px solid var(--muted);border-radius:6px;padding:0 .4rem;background:var(--card)}

/* ---------- chân trang ---------- */
footer{background:var(--band);color:rgba(255,255,255,.85);border-top:4px solid var(--accent);padding-block:20px 30px;font-size:.78rem}
footer .inner{display:flex;flex-wrap:wrap;gap:6px 24px;justify-content:space-between}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--band);color:var(--on-band);font-size:.82rem;font-weight:600;padding:.6rem 1.1rem;border-radius:999px;z-index:50;box-shadow:var(--shadow);border-left:6px solid var(--accent)}
.loading{padding:40px 0;color:var(--ink-2)}
.no-o{font-size:.8em;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:.14em;margin-left:.03em}

/* ---------- trang riêng của thuật ngữ (bố cục kiểu từ điển) ---------- */
.crumbs{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:.8rem;color:var(--ink-2);margin:0 0 16px}
.crumbs button{background:none;border:0;padding:.55rem 0;color:var(--accent-ink);cursor:pointer;font:inherit;font-weight:600;text-decoration:underline;text-decoration-color:transparent;text-underline-offset:3px;text-align:left}
.crumbs button:hover{text-decoration-color:var(--accent)}
.crumbs .sep{color:var(--muted);font-weight:700}
.ep-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:40px;align-items:start}
.ep-main{min-width:0}
.ep-head{padding-bottom:18px;border-bottom:1px solid var(--rule)}
.ep-kick{font-size:.8rem;color:var(--ink-2);margin:0 0 6px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-weight:500}
.ep-kick .num{margin-top:0}
.ep-title{display:block;line-height:1.1}
.ep-title .ep-en{display:inline;vertical-align:middle}
.ep-title .spk{display:inline-grid;vertical-align:middle;margin:0 .35em .1em .4em}
.ep-title .var{display:inline-block;font-size:clamp(1.1rem,2.4vw,1.5rem);margin-left:.2em;color:var(--ink-2);letter-spacing:0;font-weight:500;font-style:italic;vertical-align:middle}
.ep-en{font-weight:800;font-size:clamp(2.2rem,5.2vw,3.3rem);line-height:1.08;margin:0;letter-spacing:-.02em;overflow-wrap:anywhere;color:var(--brand)}
.spk{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;cursor:pointer;box-shadow:var(--shadow-s);transition:filter .15s,transform .1s}
.spk:hover{filter:brightness(1.12)}
.spk:active{transform:scale(.95)}
.spk svg{width:22px;height:22px;stroke:currentColor;fill:none}
.ep-vi{font-size:clamp(1.3rem,2.8vw,1.8rem);font-weight:700;margin:8px 0 0;line-height:1.3;overflow-wrap:anywhere;color:var(--accent-ink)}
.ep-vi .var{font-size:.62em;font-weight:400;margin-left:.2em;color:var(--ink-2)}
.ep-head .actions{margin-top:16px}
.ep-body{display:grid;grid-template-columns:minmax(0,1fr);gap:26px;margin-top:24px;align-items:start}
.ep-body.has-fig{grid-template-columns:minmax(0,1fr) minmax(260px,380px)}
.dblock{border-left:5px solid var(--band);padding:2px 0 2px 18px;margin:0 0 26px}
.dblock.en{border-left-color:var(--accent)}
.ep-defs>.dblock.en,.ep-defs>.dblock.vi{font:inherit;color:inherit;font-style:normal}
.dh{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.lg{font-size:.7rem;font-weight:800;letter-spacing:.06em;color:var(--on-band);background:var(--band);border-radius:4px;padding:.12rem .5rem}
.dblock.en .lg{background:var(--accent);color:var(--on-accent)}
.dt{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);font-weight:700}
.def{margin:0;font-size:1.1rem;line-height:1.62;font-weight:500;max-width:66ch;overflow-wrap:anywhere}
.eg{margin-top:12px;padding-left:14px;border-left:2px solid var(--muted);max-width:66ch}
.egl{display:block;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);font-weight:700;margin-bottom:2px}
.eg p{margin:0;color:var(--ink-2);font-size:1rem;overflow-wrap:anywhere}
.ep-sec{margin-top:28px}
.ep-sec>.lbl{display:flex;align-items:center;gap:10px}
.ep-sec>.lbl::after{content:"";flex:1;height:1px;background:var(--rule)}
.ep-sec .meta{margin-top:0;padding-top:0;border-top:0}
.ep-pn{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:36px;padding-top:18px;border-top:1px solid var(--rule)}
.ep-pn a{display:block;border:1px solid var(--rule);border-radius:12px;padding:.7rem 1rem;color:var(--ink);text-decoration:none;min-width:0;background:var(--card);transition:border-color .15s,box-shadow .15s}
.ep-pn a:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.ep-pn .dir{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-ink);font-weight:700}
.ep-pn .nx{text-align:right}
.ep-side{position:sticky;top:calc(var(--bar-h) + env(safe-area-inset-top,0px) + 16px);max-height:calc(100vh - var(--bar-h) - 40px);max-height:calc(100dvh - var(--bar-h) - 40px);overflow:auto;background:var(--card);border:1px solid var(--rule);border-top:4px solid var(--band);border-radius:12px;padding:14px 10px 14px}
.ep-side h2{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-ink);margin:0 0 2px 6px;font-weight:700}
.ep-side .side-t{font-size:1.04rem;font-weight:700;color:var(--brand);margin:0 0 10px 6px;line-height:1.3}
.ep-side ul{list-style:none;margin:0;padding:0}
.ep-side a{display:grid;grid-template-columns:2.4rem minmax(0,1fr);gap:4px;padding:.38rem .5rem;border-left:3px solid transparent;border-radius:0 8px 8px 0;color:var(--ink-2);text-decoration:none;font-size:.9rem;line-height:1.35}
.ep-side a small{display:block;font-size:.8rem;opacity:.9}
.ep-side a:hover{color:var(--brand);background:var(--brand-soft)}
.ep-side a[aria-current="true"]{color:var(--brand);background:var(--accent-soft);border-left-color:var(--accent);font-weight:700}
.ep-side .num{margin-top:.1rem;background:none;padding:0;font-size:.72rem;color:var(--accent-ink)}
.q3d .q-grid{grid-template-columns:minmax(0,1fr);gap:18px}

/* ---------- hình minh họa ---------- */
.fig{margin:0;background:var(--card);border:1px solid var(--rule);border-radius:14px;box-shadow:var(--shadow-s);padding:14px 14px 12px;display:grid;justify-items:center}
.fig>.lbl{justify-self:start;margin-bottom:4px}
.fig svg{display:block;width:100%;max-width:560px;height:auto;overflow:visible}
.fig figcaption{margin-top:8px;font-size:.86rem;color:var(--ink-2);text-align:center;max-width:60ch}
.fg-ink{stroke:var(--brand);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.fg-ink2{stroke:var(--ink-2);fill:none;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}
.fg-thin{stroke:var(--muted);fill:none;stroke-width:1}
.fg-acc{stroke:var(--accent);fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.fg-dash{stroke-dasharray:5 4}
.fg-fill{fill:var(--accent-soft);fill-opacity:.9}
.fg-fill2{fill:var(--brand-soft);fill-opacity:.9}
.fg-pt{fill:var(--brand);stroke:none}
.fg-pta{fill:var(--accent);stroke:var(--brand);stroke-width:1.2}
.fg-t{fill:var(--ink);font-family:var(--f-math);font-size:15px;font-style:italic}
.fg-ts{fill:var(--ink-2);font-family:var(--f-math);font-size:13px;font-style:italic}
.fg-tb{fill:var(--ink);font-family:var(--f-body);font-size:14px}
.fg-tr{fill:var(--ink);font-family:var(--f-body);font-size:12px}
.fg-ah{fill:var(--brand);stroke:none}
.fg-aha{fill:var(--accent);stroke:none}

/* ---------- đáp ứng ---------- */
@media (max-width:1100px){
  .bar-top .inner{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"brand tools" "tabs tabs";padding-block:8px 0}
  .tabs{margin:0 -6px;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent)}
  .tabs.end{-webkit-mask-image:none;mask-image:none}
  .ep-body.has-fig{grid-template-columns:minmax(0,1fr)}
  .ep-body.has-fig .fig{max-width:520px}
}
@media (max-width:960px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .toc{display:none}
  .mobile-filter{display:block;margin-bottom:16px}
  .q-grid{grid-template-columns:minmax(0,1fr)}
  .ep-grid{grid-template-columns:minmax(0,1fr);gap:30px}
  .ep-side{position:static;max-height:none}
  .hgrid{grid-template-columns:minmax(0,1fr)}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ccs{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:760px){
  .mast{padding-block:30px 28px}
  .mast-in{grid-template-columns:minmax(0,1fr)}
  .mast-fig{display:none}
  .mast::before{opacity:.55}
  .search kbd{display:none}
  .search.big input{height:54px;font-size:1.02rem}

function strip(s){return String(s).replace(/[⟦⟧]/g,"")}
const NOASC=/^[acemnorsuvwxz]/;
function vecHTML(n){
  const m=/^([A-Za-zα-ωΑ-Ω])([₀-₉ᵢₙₘ′’']*)(?:_([A-Za-z0-9]+))?$/.exec(n);
  if(m){ // một chữ cái: mũi tên chỉ đặt trên chữ cái, chỉ số/dấu phẩy đứng ngoài
    const lc=/^[ij]/.test(m[1])?" vdt":(NOASC.test(m[1])?" lc":"");
    return `<span class="vg"><span class="vec${lc}">${m[1]}</span>${m[2]}${m[3]?`<sub>${m[3]}</sub>`:""}</span>`;
  }
  const h=n.replace(/_([A-Za-z0-9]+)/g,(a,b)=>`<sub>${b}</sub>`); // tên nhiều chữ (AB, P₁P₂, 0…): mũi tên phủ cả tên
  return `<span class="vec">${h}</span>`;
}

function normChar(c){
  if(c==="đ")return"d"; if(c==="Đ")return"d";
  const n=c.normalize("NFD").replace(/[̀-ͯ]/g,"");
  return (n||c).toLowerCase().charAt(0)||c;
}

function hl(text,qn){
  if(!qn)return esc(text);
  const chars=[...text];const n=chars.map(normChar).join("");
  const i=n.indexOf(qn);if(i<0)return esc(text);
  return esc(chars.slice(0,i).join(""))+"<mark>"+esc(chars.slice(i,i+qn.length).join(""))+"</mark>"+esc(chars.slice(i+qn.length).join(""));
}

function buildIndex(){
  const variants=new Map();
  const add=(n,s)=>{if(!variants.has(n))variants.set(n,new Set());variants.get(n).add(s)};
  for(const [a,b,ns] of D.lookupEnVi)ns.forEach(n=>{add(n,a);add(n,b)});
  for(const [a,b,ns] of D.lookupViEn)ns.forEach(n=>{add(n,a);add(n,b)});
  searchIdx=D.entries.map(e=>{
    const names=new Set([e.en,e.vi,...splitTerm(e.en),...splitTerm(e.vi),...(variants.get(e.n)||[])]);
    return {e,names:[...names].filter(Boolean).map(s=>norm(s.replace(/[()]/g,""))),defs:norm(strip(e.defEn+" "+e.defVi))};
  });
}
function search(q){
  const qn=norm(q.trim()).replace(/\s+/g," ");
  if(!qn)return [];
  const m=qn.match(/^#?(\d{1,3})$/);
  const out=[];
  for(const it of searchIdx){
    let s=0;
    if(m&&it.e.n===+m[1])s=200;
    for(const nm of it.names){
      if(nm===qn)s=Math.max(s,100);
      else if(nm.startsWith(qn))s=Math.max(s,80);
      else if((" "+nm).includes(" "+qn))s=Math.max(s,60);
      else if(nm.includes(qn))s=Math.max(s,40);
    }
    let inDef=false;
    if(!s&&qn.length>2&&it.defs.includes(qn)){s=10;inDef=true}
    if(s)out.push({e:it.e,s,inDef});
  }
  out.sort((a,b)=>b.s-a.s||a.e.n-b.e.n);
  return out;
}

function fcPool(){
  const sc=S.fc.scope;
  if(sc==="saved")return[...S.favs].map(n=>byN.get(n)).filter(Boolean);
  if(sc==="all")return D.entries.slice();
  return D.entries.filter(e=>e.chapter===+sc);

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function fcBuild(){S.fc.deck=shuffle(fcPool().filter(e=>!S.fc.known.has(e.n)).map(e=>e.n));S.fc.flipped=false}
function fcFlip(){S.fc.flipped=!S.fc.flipped;renderCards(true)}
function fcAnswer(ok){
  const d=S.fc.deck;if(!d.length)return;
  const n=d.shift();
  if(ok){S.fc.known.add(n);store.set("known",[...S.fc.known])}else d.push(n);
  S.fc.flipped=false;renderCards(true);
}
function renderCards(keep){
  const L=t();

    <label>${L.fcDir}<select id="fcDir"><option value="en" ${S.fc.dir==="en"?"selected":""}>EN → VI</option><option value="vi" ${S.fc.dir==="vi"?"selected":""}>VI → EN</option></select></label>
    <button class="btn" id="fcShuffle">${L.shuffle}</button><button class="btn" id="fcReset">${L.reset}</button></div>`;
  let card;
  if(!pool.length)card=`<div class="empty"><strong>${L.fcEmpty}</strong>${S.fc.scope==="saved"?L.savedHint:""}</div>`;
  else if(!d.length)card=`<div class="empty"><strong>${L.fcDone}</strong>${L.fcDoneHint}</div>`;
  else{
    const e=byN.get(d[0]), front=S.fc.dir==="en"?e.en:e.vi, back=S.fc.dir==="en"?e.vi:e.en;
    const def=S.lang==="en"?e.defEn:e.defVi;
    card=`<div class="fcard fade" id="fcard" role="button" tabindex="0" aria-label="${L.flip}">
      <div class="corner"><span>${NO(e.n)} · ${L.chShort} ${e.chapter} · ${e.section}</span><span>${S.fc.dir==="en"?"EN":"VI"}</span></div>
      <p class="front">${termHTML(front,"")}</p>
      ${S.fc.flipped?`<div class="back"><div class="other">${termHTML(back,"")}</div><p>${rich(def)}</p></div>`:""}
      <div class="hint">${L.fcTap}</div></div>
      <div class="fc-actions">
        ${S.fc.flipped?`<button class="btn" id="fcAgain">← ${L.again}</button><button class="btn" id="fcKnown">${L.known} →</button>`:`<button class="btn" id="fcFlipBtn">${L.flip}</button>`}
        ${canSpeak?`<button class="btn" id="fcSpeak">${L.speak}</button>`:""}
      </div>`;
  }
  view.innerHTML=`<div class="fc-wrap">${opts}${card}<p class="fc-progress">${pool.length?L.fcLeft(d.length,knownHere):""}</p></div>`;
  $("#fcScope").addEventListener("change",e=>{S.fc.scope=e.target.value;renderCards(false)});
  $("#fcDir").addEventListener("change",e=>{S.fc.dir=e.target.value;S.fc.flipped=false;renderCards(true)});
  $("#fcShuffle").addEventListener("click",()=>{shuffle(S.fc.deck);S.fc.flipped=false;renderCards(true)});
  $("#fcReset").addEventListener("click",()=>{pool.forEach(e=>S.fc.known.delete(e.n));store.set("known",[...S.fc.known]);renderCards(false)});
  const fc=$("#fcard");if(fc){fc.addEventListener("click",fcFlip);fc.addEventListener("keydown",ev=>{if(ev.key==="Enter"){ev.preventDefault();fcFlip()}})}
  const b1=$("#fcFlipBtn");if(b1)b1.addEventListener("click",fcFlip);
  const b2=$("#fcKnown");if(b2)b2.addEventListener("click",()=>fcAnswer(true));
  const b3=$("#fcAgain");if(b3)b3.addEventListener("click",()=>fcAnswer(false));
  const b4=$("#fcSpeak");if(b4)b4.addEventListener("click",()=>speak(cleanEn(byN.get(S.fc.deck[0]).en)));
}

/* ================= 3D quadrics ================= */
const lin=(a,b,n)=>Array.from({length:n},(_,i)=>a+(b-a)*i/(n-1));
const TAU=Math.PI*2, N=72;
function ellipseZ(rx,ry,z){return lin(0,TAU,N).map(t=>[rx*Math.cos(t),ry*Math.sin(t),z])}
function clipSplit(pts,ok){const out=[];let cur=[];for(const p of pts){if(ok(p))cur.push(p);else{if(cur.length>1)out.push(cur);cur=[]}}if(cur.length>1)out.push(cur);return out}
const QDEF={
  ellipsoid:{n:255,eq:"x²/a² + y²/b² + z²/c² = 1",params:["a","b","c"],defaults:{a:1.6,b:1.1,c:0.9},axis:"z",
    gen(a,b,c){const L=[];lin(0,Math.PI,13).slice(1,-1).forEach(p=>L.push(ellipseZ(a*Math.sin(p),b*Math.sin(p),c*Math.cos(p))));
      lin(0,TAU,17).slice(0,-1).forEach(t=>L.push(lin(0,Math.PI,N/2).map(p=>[a*Math.sin(p)*Math.cos(t),b*Math.sin(p)*Math.sin(t),c*Math.cos(p)])));return{L}},
    sec(a,b,c,h){const r=1-h*h/(c*c);if(r<-1e-3)return{k:"none"};if(r<0.004)return{k:"point",P:[[0,0,h]]};const s=Math.sqrt(r);return{k:Math.abs(a-b)<.05?"circle":"ellipse",L:[ellipseZ(a*s,b*s,h)]}},
    rev(a,b,c){return Math.abs(a-b)<.05?(Math.abs(a-c)<.05?257:256):null}},
  sphere:{n:257,eq:"x² + y² + z² = R²",params:["R"],defaults:{a:1.2},axis:"z",
    gen(R){return QDEF.ellipsoid.gen(R,R,R)},sec(R,_b,_c,h){return QDEF.ellipsoid.sec(R,R,R,h)},rev(){return null}},
  hyp1:{n:258,eq:"x²/a² + y²/b² − z²/c² = 1",params:["a","b","c"],defaults:{a:1.3,b:0.9,c:0.9},axis:"z",ruled:true,
    gen(a,b,c){const U=1.2,L=[],R=[];lin(-U,U,9).forEach(u=>L.push(ellipseZ(a*Math.cosh(u),b*Math.cosh(u),c*Math.sinh(u))));
      lin(0,TAU,17).slice(0,-1).forEach(t=>L.push(lin(-U,U,N/2).map(u=>[a*Math.cosh(u)*Math.cos(t),b*Math.cosh(u)*Math.sin(t),c*Math.sinh(u)])));
      const sm=Math.sinh(U);lin(0,TAU,19).slice(0,-1).forEach(t=>{[1,-1].forEach(sg=>R.push([-sm,sm].map(s=>[a*(Math.cos(t)-s*Math.sin(t)),b*(Math.sin(t)+s*Math.cos(t)),sg*c*s])))});return{L,R}},
    sec(a,b,c,h){const s=Math.sqrt(1+h*h/(c*c));return{k:Math.abs(a-b)<.05?"circle":"ellipse",L:[ellipseZ(a*s,b*s,h)]}},
    rev(a,b){return Math.abs(a-b)<.05?260:null}},
  hyp2:{n:259,eq:"x²/a² − y²/b² − z²/c² = 1",params:["a","b","c"],defaults:{a:0.6,b:0.9,c:0.9},axis:"x",
    gen(a,b,c){const U=1.35,L=[];[1,-1].forEach(sg=>{lin(0.15,U,7).forEach(u=>L.push(lin(0,TAU,N).map(t=>[sg*a*Math.cosh(u),b*Math.sinh(u)*Math.cos(t),c*Math.sinh(u)*Math.sin(t)])));
      lin(0,TAU,13).slice(0,-1).forEach(t=>L.push(lin(0,U,N/2).map(u=>[sg*a*Math.cosh(u),b*Math.sinh(u)*Math.cos(t),c*Math.sinh(u)*Math.sin(t)])))});return{L}},
    sec(a,b,c,h){const r=h*h/(a*a)-1;if(r<-1e-3)return{k:"none"};if(r<0.01)return{k:"point",P:[[h,0,0]]};const s=Math.sqrt(r);return{k:Math.abs(b-c)<.05?"circle":"ellipse",L:[lin(0,TAU,N).map(t=>[h,b*s*Math.cos(t),c*s*Math.sin(t)])]}},
    rev(a,b,c){return Math.abs(b-c)<.05?260:null}},
  ellParab:{n:261,eq:"x²/a² + y²/b² = 2pz",params:["a","b","p"],defaults:{a:1.2,b:0.8,c:0.6},axis:"z",
    gen(a,b,p){const R0=1.3,L=[];lin(0,R0,8).slice(1).forEach(r=>L.push(ellipseZ(a*r,b*r,r*r/(2*p))));
      lin(0,TAU,17).slice(0,-1).forEach(t=>L.push(lin(0,R0,N/2).map(r=>[a*r*Math.cos(t),b*r*Math.sin(t),r*r/(2*p)])));return{L}},
    sec(a,b,p,h){if(h<-1e-3)return{k:"none"};if(h<0.02)return{k:"point",P:[[0,0,0]]};const r=Math.sqrt(2*p*h);return{k:Math.abs(a-b)<.05?"circle":"ellipse",L:[ellipseZ(a*r,b*r,h)]}},
    rev(a,b){return Math.abs(a-b)<.05?262:null}},
  hypParab:{n:263,eq:"x²/a² − y²/b² = 2pz",params:["a","b","p"],defaults:{a:1.2,b:1.2,c:0.7},axis:"z",ruled:true,
    gen(a,b,p){const M=1.3,L=[],R=[];const P=(X,Y)=>[a*X,b*Y,(X*X-Y*Y)/(2*p)];

  cone:{n:253,eq:"x²/a² + y²/b² − z²/c² = 0",params:["a","b","c"],defaults:{a:1.1,b:0.8,c:1},axis:"z",
    gen(a,b,c){const T=1.3,L=[];lin(-T,T,11).filter(x=>Math.abs(x)>.05).forEach(s=>L.push(ellipseZ(a*s,b*s,c*s)));
      lin(0,TAU,17).slice(0,-1).forEach(t=>L.push([[-T*a*Math.cos(t),-T*b*Math.sin(t),-T*c],[T*a*Math.cos(t),T*b*Math.sin(t),T*c]]));return{L}},
    sec(a,b,c,h){if(Math.abs(h)<0.02)return{k:"point",P:[[0,0,0]]};const s=Math.abs(h)/c;return{k:Math.abs(a-b)<.05?"circle":"ellipse",L:[ellipseZ(a*s,b*s,h)]}},
    rev(a,b){return Math.abs(a-b)<.05?254:null}},
  ellCyl:{n:250,eq:"x²/a² + y²/b² = 1",params:["a","b"],defaults:{a:1.3,b:0.8},axis:"z",
    gen(a,b){const H=1.4,L=[];lin(-H,H,7).forEach(z=>L.push(ellipseZ(a,b,z)));lin(0,TAU,19).slice(0,-1).forEach(t=>L.push([[a*Math.cos(t),b*Math.sin(t),-H],[a*Math.cos(t),b*Math.sin(t),H]]));return{L}},
    sec(a,b,_c,h){return{k:Math.abs(a-b)<.05?"circle":"ellipse",L:[ellipseZ(a,b,h)]}},
    rev(a,b){return Math.abs(a-b)<.05?249:null}},
  hypCyl:{n:251,eq:"x²/a² − y²/b² = 1",params:["a","b"],defaults:{a:0.7,b:0.7},axis:"z",
    gen(a,b){const H=1.4,U=1.3,L=[];[1,-1].forEach(sg=>{lin(-H,H,7).forEach(z=>L.push(lin(-U,U,N/2).map(u=>[sg*a*Math.cosh(u),b*Math.sinh(u),z])));
      lin(-U,U,11).forEach(u=>L.push([[sg*a*Math.cosh(u),b*Math.sinh(u),-H],[sg*a*Math.cosh(u),b*Math.sinh(u),H]]))});return{L}},
    sec(a,b,_c,h){const U=1.3;return{k:"hyper",L:[1,-1].map(sg=>lin(-U,U,N/2).map(u=>[sg*a*Math.cosh(u),b*Math.sinh(u),h]))}},
    rev(){return null}},
  parabCyl:{n:252,eq:"y² = 2px",params:["p"],defaults:{c:0.6},axis:"z",
    gen(p){const H=1.4,Y=1.5,L=[];lin(-H,H,7).forEach(z=>L.push(lin(-Y,Y,N/2).map(y=>[y*y/(2*p),y,z])));lin(-Y,Y,13).forEach(y=>L.push([[y*y/(2*p),y,-H],[y*y/(2*p),y,H]]));return{L}},
    sec(p,_b,_c,h){const Y=1.5;return{k:"parab",L:[lin(-Y,Y,N/2).map(y=>[y*y/(2*p),y,h])]}},
    rev(){return null}}
};
const QORDER=["ellipsoid","sphere","hyp1","hyp2","ellParab","hypParab","cone","ellCyl","hypCyl","parabCyl"];
Object.values(QDEF).forEach(q=>q.h0=0.35);

let COL={};
function refreshColors(){const cs=getComputedStyle(document.documentElement);["ink","ink-2","accent","muted","rule","paper-2","hero-ink","hero-ink-2","hero-accent"].forEach(k=>COL[k]=cs.getPropertyValue("--"+k).trim());COL.ink=cs.getPropertyValue("--brand").trim();if(quadView)quadView.dirty=true;if(mastView)mastView.dirty=true}

function makeView(canvas,opt={}){
  const v={canvas,ctx:canvas.getContext("2d"),yaw:opt.yaw??-0.7,pitch:opt.pitch??0.42,auto:opt.auto??true,dirty:true,scene:null,raf:0,drag:null,axes:opt.axes??true,lw:opt.lw??1};
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(reduce)v.auto=false;
  function size(){const r=canvas.getBoundingClientRect(),dpr=Math.min(2,window.devicePixelRatio||1);const w=Math.max(10,Math.round(r.width*dpr)),h=Math.max(10,Math.round(r.height*dpr));if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h}v.dpr=dpr}
  function draw(){
    const sc=v.scene;if(!sc)return;size();
    const ctx=v.ctx,W=canvas.width,H=canvas.height;const K=opt.hero?{ink:COL["hero-ink"],"ink-2":COL["hero-ink-2"],accent:COL["hero-accent"]}:COL;ctx.clearRect(0,0,W,H);
    const cy=Math.cos(v.yaw),sy=Math.sin(v.yaw),cp=Math.cos(v.pitch),sp=Math.sin(v.pitch);
    const Rb=sc.R, s=Math.min(W,H)*0.40/Rb, dist=Rb*6;
    const proj=p=>{const x1=p[0]*cy-p[1]*sy,y1=p[0]*sy+p[1]*cy,z1=p[2];const Y=z1*cp+y1*sp,Dp=-z1*sp+y1*cp;const f=dist/(dist+Dp);return[W/2+x1*s*f,H/2-Y*s*f+H*0.02,Dp]};
    const strokeSet=(lines,color,width,minA,dash)=>{
      const bins=Array.from({length:6},()=>[]);
      for(const ln of lines){let prev=proj(ln[0]);for(let i=1;i<ln.length;i++){const cur=proj(ln[i]);const d=((prev[2]+cur[2])/2/Rb+1)/2;const bi=Math.max(0,Math.min(5,Math.floor((1-d)*6)));bins[bi].push(prev,cur);prev=cur}}
      ctx.strokeStyle=color;ctx.lineWidth=width*v.dpr;ctx.lineCap="round";ctx.setLineDash(dash?dash.map(x=>x*v.dpr):[]);
      bins.forEach((b,i)=>{if(!b.length)return;ctx.globalAlpha=minA+(1-minA)*(i/5);ctx.beginPath();for(let j=0;j<b.length;j+=2){ctx.moveTo(b[j][0],b[j][1]);ctx.lineTo(b[j+1][0],b[j+1][1])}ctx.stroke()});
      ctx.globalAlpha=1;ctx.setLineDash([]);
    };
    if(v.axes){
      const A=Rb*1.12;const ax=[[[-A,0,0],[A,0,0],"x"],[[0,-A,0],[0,A,0],"y"],[[0,0,-A],[0,0,A],"z"]];
      strokeSet(ax.map(a=>[a[0],a[1]]),K["ink-2"],.8,.5,[3,4]);
      ctx.fillStyle=K["ink-2"];ctx.font=`italic ${15*v.dpr}px "Newsreader", Georgia, serif`;ctx.textAlign="center";ctx.textBaseline="middle";
      ax.forEach(a=>{const p=proj(a[1].map(x=>x*1.07));ctx.fillText(a[2],p[0],p[1])});
    }
    if(sc.plane)strokeSet([sc.plane],K.accent,1,.35,[2,3]);
    strokeSet(sc.L,K.ink,v.lw,.18);
    if(sc.R2)strokeSet(sc.R2,K.accent,v.lw*1.1,.3);
    if(sc.S)strokeSet(sc.S,K.accent,2.4,.85);
    if(sc.P){ctx.fillStyle=K.accent;sc.P.forEach(p=>{const q=proj(p);ctx.beginPath();ctx.arc(q[0],q[1],4*v.dpr,0,TAU);ctx.fill()})}
  }
  function loop(){v.raf=requestAnimationFrame(loop);if(!canvas.offsetParent)return;if(v.auto&&!v.drag){v.yaw+=0.0035;v.dirty=true}if(v.dirty){v.dirty=false;draw()}}
  canvas.addEventListener("pointerdown",e=>{if(opt.static)return;v.drag={x:e.clientX,y:e.clientY,yaw:v.yaw,pitch:v.pitch};canvas.setPointerCapture(e.pointerId)});
  canvas.addEventListener("pointermove",e=>{if(!v.drag)return;v.yaw=v.drag.yaw+(e.clientX-v.drag.x)*0.01;v.pitch=Math.max(-1.5,Math.min(1.5,v.drag.pitch+(e.clientY-v.drag.y)*0.01));v.dirty=true});
  const end=()=>{v.drag=null};canvas.addEventListener("pointerup",end);canvas.addEventListener("pointercancel",end);
  v.start=()=>{cancelAnimationFrame(v.raf);loop()};v.stop=()=>cancelAnimationFrame(v.raf);
  v.set=(sc)=>{let R=0;[...sc.L,...(sc.R2||[])].forEach(l=>l.forEach(p=>{R=Math.max(R,Math.abs(p[0]),Math.abs(p[1]),Math.abs(p[2]))}));sc.R=R||1;v.scene=sc;v.dirty=true};
  window.addEventListener("resize",()=>{v.dirty=true});
  return v;
}

let quadView=null, mastView=null;
function stopQuad(){if(quadView){quadView.stop();quadView=null}}
function quadArgs(){const q=S.quad,d=QDEF[q.id];const map={a:q.a,b:q.b,c:q.c,p:q.c,R:q.a};const args=d.params.map(k=>map[k]);while(args.length<3)args.push(1);return args}
function quadScene(){
  const q=S.quad,d=QDEF[q.id],args=quadArgs();
  const g=d.gen(...args);const sc={L:g.L};
  if(d.ruled&&q.rulings)sc.R2=g.R;
  let ext=0;g.L.forEach(l=>l.forEach(p=>{ext=Math.max(ext,Math.abs(p[d.axis==="x"?0:2]))}));
  let lo=-ext,hi=ext;if(q.id==="ellParab"){lo=0}
  if(q.secOn){
    const h=lo+(hi-lo)*(q.h+1)/2;const r=d.sec(...args,h);sc.S=r.L;sc.P=r.P;sc.secKind=r.k;sc.hval=h;
    let m=0;g.L.forEach(l=>l.forEach(p=>{m=Math.max(m,Math.abs(p[0]),Math.abs(p[1]),Math.abs(p[2]))}));m*=1.05;
    sc.plane=d.axis==="x"?[[h,-m,-m],[h,m,-m],[h,m,m],[h,-m,m],[h,-m,-m]]:[[-m,-m,h],[m,-m,h],[m,m,h],[-m,m,h],[-m,-m,h]];
  }
  return sc;
}
function renderQuad(host=view,embed=false){
  const L=t(), q=S.quad, d=QDEF[q.id], e=byN.get(d.n);
  const nm=x=>{const en=byN.get(QDEF[x].n);return splitTerm(S.lang==="en"?en.en:en.vi)[0]};
  const labels={a:"a",b:"b",c:"c",p:"p",R:"R"};
  const vals={a:q.a,b:q.b,c:q.c,p:q.c,R:q.a};
  host.innerHTML=`<div class="q-grid">
    <div class="q-stage"><canvas id="qc" aria-label="${esc(nm(q.id))}"></canvas><span class="q-hint">${L.qHint}</span></div>
    <div>
      ${embed?"":`<p class="lbl">${L.qPick}</p>
      <div class="q-pick">${QORDER.map(x=>`<button data-q="${x}" aria-pressed="${x===q.id}">${esc(nm(x))}</button>`).join("")}</div>
      <h2 class="q-title">${esc(splitTerm(S.lang==="en"?e.en:e.vi)[0])}</h2>
      <p class="q-sub">${esc(splitTerm(S.lang==="en"?e.vi:e.en)[0])}</p>`}
      <div class="eq" id="qeq">${d.eq}</div>
      <p class="eq-num" id="qeqn"></p>
      <span id="qrev"></span>
      ${d.params.map(k=>`<div class="ctrl"><label for="qp-${k}">${labels[k]}</label><input id="qp-${k}" type="range" min="0.3" max="2.2" step="0.05" value="${vals[k]}" data-p="${k}"><output id="qo-${k}">${(+vals[k]).toFixed(2)}</output></div>`).join("")}
      <label class="check"><input type="checkbox" id="qsec" ${q.secOn?"checked":""}> ${L.qSection} ${d.axis==="x"?"x":"z"} = h</label>
      <div class="ctrl"><label for="qh">h</label><input id="qh" type="range" min="-1" max="1" step="0.01" value="${q.h}" ${q.secOn?"":"disabled"}><output id="qho"></output></div>
      <p class="section-note" id="qnote"></p>
      ${d.ruled?`<label class="check"><input type="checkbox" id="qrul" ${q.rulings?"checked":""}> ${L.qRulings}</label>`:""}
      <label class="check"><input type="checkbox" id="qauto" ${q.auto?"checked":""}> ${L.qAuto}</label>
      <div class="q-links">${embed?"":`<button class="btn" data-go="${d.n}">${L.qOpen} ${NO(d.n)}</button>`}<button class="btn" id="qreset">${L.qResetView}</button></div>
    </div></div>`;
  const cv=$("#qc");quadView=makeView(cv,{auto:q.auto,lw:1.1});
  const update=()=>{
    const sc=quadScene();quadView.set(sc);
    const args=quadArgs();
    $("#qeqn").textContent=`${L.with} `+d.params.map((k,i)=>`${k} = ${args[i].toFixed(2)}`).join(", ");
    const r=d.rev(...args);$("#qrev").innerHTML=r?`<button class="rev chip" data-go="${r}">${L.qRev} · #${r}</button>`:"";
    if(q.secOn){$("#qho").textContent=sc.hval.toFixed(2);const kmap={none:L.secNone,point:L.secPoint,ellipse:L.secEllipse,circle:L.secCircle,hyper:L.secHyper,lines:L.secLines,parab:L.secParab};$("#qnote").innerHTML=`${d.axis==="x"?"x":"z"} = ${sc.hval.toFixed(2)}: ${kmap[sc.secKind]}`}
    else{$("#qho").textContent="";$("#qnote").textContent=""}
  };
  update();quadView.start();
  const pk=host.querySelector(".q-pick");if(pk)pk.addEventListener("click",ev=>{const b=ev.target.closest("[data-q]");if(!b)return;const id=b.dataset.q;Object.assign(S.quad,{id,a:1.3,b:1,c:1},QDEF[id].defaults);stopQuad();renderQuad(host,embed)});
  host.querySelectorAll("[data-p]").forEach(inp=>inp.addEventListener("input",()=>{const k=inp.dataset.p,v=+inp.value;if(k==="a"||k==="R")q.a=v;else if(k==="b")q.b=v;else q.c=v;$("#qo-"+k).textContent=v.toFixed(2);update()}));
  $("#qsec").addEventListener("change",ev=>{q.secOn=ev.target.checked;$("#qh").disabled=!q.secOn;update()});
  $("#qh").addEventListener("input",ev=>{q.h=+ev.target.value;update()});
  const rul=$("#qrul");if(rul)rul.addEventListener("change",ev=>{q.rulings=ev.target.checked;update()});
  $("#qauto").addEventListener("change",ev=>{q.auto=ev.target.checked;quadView.auto=q.auto});
  $("#qreset").addEventListener("click",()=>{quadView.yaw=-0.7;quadView.pitch=0.42;quadView.dirty=true});
}

/* ================= boot ================= */
function boot(data){
  D=data;D.entries.forEach(e=>byN.set(e.n,e));buildIndex();
  document.documentElement.lang=S.lang;document.body.classList.toggle("lang-en",S.lang==="en");
  $("#langVi").setAttribute("aria-pressed",S.lang==="vi");$("#langEn").setAttribute("aria-pressed",S.lang==="en");
  refreshColors();
  placeSearch();
  route();
  window.addEventListener("resize",setBar);
  // masthead drawing
  const mc=$("#mastCanvas");
  if(mc){
    mastView=makeView(mc,{auto:true,axes:false,static:true,pitch:0.32,lw:.9,hero:true});
    const g=QDEF.hyp1.gen(1,1,1.05);mastView.set({L:g.L});mastView.start();
  }
}
/* ---- in ấn ---- */
function afterPrint(){if(S.printing){S.printing=false;render()}}
window.addEventListener("afterprint",afterPrint);
function printAll(){S.printing=true;render();setTimeout(()=>window.print(),60)}
view.addEventListener("click",ev=>{
  if(ev.target.closest("[data-print]")){printAll();return}
  if(ev.target.closest("[data-rand]")){ev.preventDefault();randomEntry();return}
  if(ev.target.closest("[data-clr-recent]")){S.recent=[];store.set("recent",[]);render();return}
  const sv=ev.target.closest("[data-sv]");if(sv){exportSaved(sv.dataset.sv);return}
  const gv=ev.target.closest("[data-gov]");if(gv){go(gv.dataset.gov);return}
  const fl=ev.target.closest("[data-flt]");
  if(fl){const [c,sc]=fl.dataset.flt.split("|");S.chapter=+c;S.section=sc;S.q="";go("browse");return}
  const g=ev.target.closest("[data-go]");
  if(g){openEntry(+g.dataset.go);return}
  if(ev.target.closest("[data-act]"))entryClick(ev);
});
$("#mastTry").addEventListener("click",ev=>{if(ev.target.closest("[data-rand]")){ev.preventDefault();if(D)randomEntry()}});
document.addEventListener("click",ev=>{const k=ev.target.closest(".skip");if(!k)return;ev.preventDefault();view.setAttribute("tabindex","-1");view.focus({preventScroll:true});window.scrollTo({top:Math.max(0,$("main").offsetTop-$("#bar").offsetHeight)})});
window.addEventListener("hashchange",route);
renderChrome();
if(window.HHGT_DATA)boot(window.HHGT_DATA);
else view.innerHTML=`<div class="empty"><strong>Không tải được dữ liệu</strong>Tải lại trang để thử lại.</div>`;
})();
</script>
